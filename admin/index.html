<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="../assets/favicon.ico" sizes="32x32"><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
<title>Expeditions admin · MW Photo Tours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400..700&family=Montserrat:wght@500;600;700&display=swap" media="print" onload="this.media='all'">
<style>
:root{--night:#0A0908;--forest-night:#0C2925;--paper:#FEFBF1;--off:#F4F4F4;--gold:#F4AF56;--gold-soft:#E4AA7C;--amber:#E8A23E;--leaf:#A9C48C;--red:#F08A7A;
  --muted:rgba(244,244,244,.78);--faint:rgba(244,244,244,.56);--rule:rgba(254,251,241,.14);
  --sans:"Google Sans","Helvetica Neue",Arial,sans-serif;--label:"Montserrat","Google Sans","Helvetica Neue",Arial,sans-serif;--pill:64px;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(120% 60% at 50% 0,#12403A 0,var(--forest-night) 40%,var(--night) 100%) no-repeat var(--night);color:var(--off);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
[hidden]{display:none!important}
main{width:min(860px,100%);margin:0 auto;padding:calc(36px + env(safe-area-inset-top)) 16px 64px;display:grid;gap:22px}
.lbl{margin:0;font:600 11.5px/1.4 var(--label);letter-spacing:.22em;text-transform:uppercase;color:var(--gold-soft)}
h1{margin:0;font-size:clamp(28px,6vw,38px);line-height:1.1;font-weight:700;color:var(--paper)}
h2{margin:0;font-size:21px;line-height:1.25;color:var(--paper)}
h3{margin:0;font:600 11.5px/1.4 var(--label);letter-spacing:.18em;text-transform:uppercase;color:var(--gold-soft)}
.lede{margin:0;color:var(--muted)}
.head{display:flex;flex-wrap:wrap;align-items:end;gap:10px 16px;justify-content:space-between}
.setup{border-color:rgba(240,138,122,.55);background:rgba(240,138,122,.07)}
.setup ol{margin:0;padding-inline-start:20px;display:grid;gap:10px;color:var(--muted)}
.setup b{color:var(--paper)}
.card{display:grid;gap:16px;padding:22px;border-radius:22px;background:rgba(254,251,241,.04);border:1px solid var(--rule)}
label{display:grid;gap:6px;font-size:14px;color:var(--muted)}
input{width:100%;height:48px;padding-inline:16px;border-radius:14px;border:1px solid rgba(254,251,241,.28);background:rgba(10,9,8,.45);color:var(--paper);font-size:16px}
input:focus{outline:none;border-color:var(--gold)}
input.code{font:600 16px/1 var(--label);letter-spacing:.12em;text-transform:uppercase}
.row{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}
.row.one{grid-template-columns:minmax(0,1fr) auto}
.codebox{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.codeval{font:700 22px/1 var(--label);letter-spacing:.16em;color:var(--paper);padding:12px 18px;border-radius:14px;border:1px solid var(--rule);background:rgba(10,9,8,.35);user-select:all;-webkit-user-select:all}
.search{position:relative}
.search svg{position:absolute;top:50%;inset-inline-start:18px;width:20px;height:20px;margin-top:-10px;fill:none;stroke:var(--gold-soft);stroke-width:1.6;stroke-linecap:round}
.search input{height:54px;padding-inline:50px 18px;border-radius:var(--pill)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill.past{border-color:var(--rule);color:var(--faint)}
.card.ended{opacity:.78}
@media (max-width:640px){.row,.row.one{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding-inline:20px;border-radius:var(--pill);border:1px solid var(--gold);background:radial-gradient(130% 160% at 0 0,rgba(244,175,86,.24),transparent 46%);color:var(--off);font-weight:700;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{border-color:rgba(244,244,244,.35);background:none}
.btn.small{min-height:36px;padding-inline:14px;font-size:13.5px}
.btn.danger{border-color:rgba(240,138,122,.55);background:none;color:#F7B2A6}
.hint{margin:0;font-size:13.5px;color:var(--faint)}
.msg{margin:0;min-height:1.4em;font-size:14.5px}
.msg.err{color:var(--red)} .msg.ok{color:var(--leaf)}
.tour-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.tour-h .ph{width:52px;height:52px;border-radius:12px;background:#1A2422 center/cover no-repeat;flex:none}
.tour-h div{flex:1;min-width:180px}
.tour-h small{display:block;color:var(--faint);font-size:13.5px}
.pill{font:600 10.5px/1 var(--label);letter-spacing:.14em;text-transform:uppercase;padding:6px 10px;border-radius:var(--pill);border:1px solid var(--rule);color:var(--faint);white-space:nowrap}
.pill.on{border-color:rgba(169,196,140,.6);color:var(--leaf)}
.pill.off{border-color:rgba(232,162,62,.55);color:var(--amber)}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:start;font:600 11px/1.3 var(--label);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:8px 8px 8px 0;border-bottom:1px solid var(--rule)}
td{padding:10px 8px 10px 0;border-bottom:1px solid rgba(254,251,241,.07);color:var(--muted);font-variant-numeric:tabular-nums;vertical-align:middle}
td b{color:var(--paper);font-weight:700}
.tbl{overflow-x:auto}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.gal figure{position:relative;margin:0;border-radius:12px;overflow:hidden;background:#14120F;aspect-ratio:1}
.gal img{display:block;width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.gal figcaption{position:absolute;inset-inline:0;bottom:0;padding:18px 8px 6px;font-size:11.5px;line-height:1.3;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.gal button{position:absolute;top:6px;inset-inline-end:6px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(10,9,8,.75);color:#F7B2A6;font-size:16px;line-height:1;cursor:pointer}
.empty{color:var(--faint);font-size:14px;margin:0}
textarea{width:100%;min-height:96px;padding:12px 16px;border-radius:14px;border:1px solid rgba(254,251,241,.28);background:rgba(10,9,8,.45);color:var(--paper);font:16px/1.5 var(--sans);resize:vertical}
textarea:focus{outline:none;border-color:var(--gold)}
[data-msg]:empty{display:none}
.trh{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:36px}
.plus{display:grid;place-items:center;width:36px;height:36px;padding:0;border-radius:50%;border:1px solid var(--gold);background:radial-gradient(130% 160% at 0 0,rgba(244,175,86,.24),transparent 46%);cursor:pointer}
.plus svg{width:18px;height:18px;fill:none;stroke:var(--gold);stroke-width:2;stroke-linecap:round}
.add{display:flex;gap:10px;align-items:center}
.add input{height:40px;flex:1;min-width:0}
.who{color:var(--paper);font-weight:700;text-decoration:underline;text-decoration-color:rgba(244,175,86,.6);text-underline-offset:3px}
.who:hover{color:var(--gold)}
.st{font:600 10.5px/1 var(--label);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.st.in{color:var(--leaf)} .st.wait{color:var(--faint)} .st.extra{color:var(--amber)}
.zoom{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(5,5,4,.92);cursor:zoom-out}
.zoom img{max-width:100%;max-height:100%;border-radius:10px}
</style>
</head>
<body>
<main>
  <div class="head">
    <div style="display:grid;gap:8px">
      <p class="lbl">MW Photo Tours · Admin</p>
      <h1>Expeditions</h1>
    </div>
    <button class="btn ghost small" id="out" type="button" hidden>Sign out</button>
  </div>

  <!-- sign in -->
  <form class="card" id="login" autocomplete="on">
    <p class="lede">Sign in with the admin login created in Supabase.</p>
    <label>Email<input id="em" type="email" autocomplete="username" required></label>
    <label>Password<input id="pw" type="password" autocomplete="current-password" required></label>
    <button class="btn" id="go" type="submit">Sign in</button>
    <p class="msg" id="lmsg" role="status"></p>
  </form>

  <div id="app" hidden style="display:grid;gap:22px">
    <div class="card setup" id="setup" hidden></div>
    <p class="lede">Each expedition: its code, its travelers, and the photos they shared. Travelers join with their name + the code, on any phone or computer.</p>
    <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      <input id="q" type="search" placeholder="Search expeditions by name, place or month" aria-label="Search expeditions" autocomplete="off"></div>
    <div id="tours" style="display:grid;gap:22px"></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(() => {
const CFG = { url: 'https://uiydebfzuxnxjqcnrylv.supabase.co', key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVpeWRlYmZ6dXhueGpxY25yeWx2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExNzY2MjksImV4cCI6MjEwNjc1MjYyOX0.JwQ2bAjMrZZCnhFq79V8W5lnzcNz-zpf8IW6xFC4Mko' };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = c => String(c || '').toUpperCase().replace(/[\s\-–_.]/g, '');
const fmt = d => d ? new Date(d).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '–';
const sb = window.supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: true, storageKey: 'mw-admin-session', detectSessionInUrl: false } });
let list = [], urls = {}, openAdd = null;

// check a code really opens an expedition page (same lock the pages use: PBKDF2-SHA256 → AES-GCM)
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function opens(path, code) {
  const html = await fetch('../' + path + 'index.html', { cache: 'no-store' }).then(r => r.text());
  const v = JSON.parse(html.match(/<script id="vault" type="application\/json">([\s\S]*?)<\/script>/)[1]);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm(code)), 'PBKDF2', false, ['deriveKey']);
  const k = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(v.salt), iterations: v.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  try { await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(v.iv) }, k, b64(v.data)); return true; } catch (e) { return false; }
}

async function load() {
  const [cfg, ov] = await Promise.all([
    fetch('../tours.json', { cache: 'no-cache' }).then(r => r.json()),
    sb.rpc('admin_overview'),
  ]);
  if (ov.error) { $('#app').hidden = true; $('#login').hidden = false; $('#out').hidden = false; say($('#lmsg'), /not_admin/.test(ov.error.message) ? 'This login is not an expedition admin yet. Run the "make Matan an admin" query from the setup file.' : 'Could not load: ' + ov.error.message, 'err'); return; }
  const db = Object.fromEntries((ov.data || []).map(t => [t.slug, t]));
  const today = new Date().toISOString().slice(0, 10);
  const when = t => t.end && today > t.end ? 'past' : t.start && today >= t.start ? 'now' : 'soon';
  const rank = { now: 0, soon: 1, past: 2 };
  list = (cfg.tours || []).filter(t => t.slug).map(t => ({ ...t, db: db[t.slug] || null, when: when(t) }))
    .sort((a, b) => rank[a.when] - rank[b.when] || (a.when === 'past' ? (b.start || '').localeCompare(a.start || '') : (a.start || '').localeCompare(b.start || '')));
  const { data: ph } = await sb.from('photos').select('id,tour_slug,item_kind,item_id,path,created_at,members(name)').order('created_at', { ascending: false });
  const photos = ph || [];
  const need = photos.map(p => p.path.replace(/\.jpg$/, '_t.jpg')).concat(photos.map(p => p.path)).filter(p => !urls[p]);
  for (let i = 0; i < need.length; i += 100) {
    const { data: s } = await sb.storage.from('tour-photos').createSignedUrls(need.slice(i, i + 100), 3600 * 6);
    (s || []).forEach(x => { if (x.signedUrl) urls[x.path] = x.signedUrl; });
  }
  render(photos);
  checkSetup(ov.data || []);
}

// what Supabase still needs, so travelers can join (shown only when something is missing)
async function checkSetup(tours) {
  const todo = [];
  try {
    const st = await fetch(CFG.url + '/auth/v1/settings', { headers: { apikey: CFG.key } }).then(r => r.json());
    if (st && st.external && st.external.anonymous_users === false)
      todo.push('<b>Turn on anonymous sign-ins.</b> Supabase → Authentication → Sign In / Providers → "Allow anonymous sign-ins" → Save. Without it, travelers open the expedition but are never registered, so they don\u2019t appear here.');
  } catch (e) {}
  if (tours.length && !('travelers' in tours[0])) todo.push('<b>Run supabase-update-travelers.txt</b> in Supabase → SQL Editor (the traveler list).');
  const v = await sb.rpc('admin_view_member', { p_member: '00000000-0000-0000-0000-000000000000' });
  if (v.error && /function|schema cache/i.test(v.error.message)) todo.push('<b>Run supabase-update-view-as.txt</b> in Supabase → SQL Editor (opening a traveler\u2019s view).');
  const box = $('#setup');
  box.innerHTML = todo.length ? `<h3>Finish the setup</h3><ol>${todo.map(t => `<li>${t}</li>`).join('')}</ol><p class="hint">Then travelers who already opened an expedition are asked for their name and the code once more, and appear here.</p>` : '';
  box.hidden = !todo.length;
}

let lastPhotos = [];
// a browser that has opened an expedition keeps its code (mw-tour-<slug>-code): offer it, so nothing has to be typed
const saved = slug => { try { return localStorage.getItem('mw-tour-' + slug + '-code') || ''; } catch (e) { return ''; } };
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const hay = t => [t.title?.en, t.title?.he, t.place?.en, t.place?.he, t.slug, t.start, t.end,
  ...[t.start, t.end].filter(Boolean).map(d => MONTHS[+d.slice(5, 7) - 1] + ' ' + d.slice(0, 4))].join(' ').toLowerCase();
const nice = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
function render(photos) {
  if (photos) lastPhotos = photos; else photos = lastPhotos;
  const term = ($('#q').value || '').trim().toLowerCase();
  const shown = list.map((t, i) => [t, i]).filter(([t]) => !term || hay(t).includes(term));
  $('#tours').innerHTML = shown.map(([t, i]) => {
    const d = t.db, ready = d && d.ready, mem = d ? d.members : [], trav = (d && d.travelers) || [], tp = photos.filter(p => p.tour_slug === t.slug);
    // the list Matan added (with who joined), then anyone who joined without being on it
    const rows = trav.map(r => ({ name: r.name, t: r, m: mem.find(m => m.traveler_id === r.id) }))
      .concat(mem.filter(m => !m.traveler_id || !trav.some(r => r.id === m.traveler_id)).map(m => ({ name: m.name, m })));
    return `<section class="card${t.when === 'past' ? ' ended' : ''}" data-i="${i}">
      <div class="tour-h"><span class="ph" style="background-image:url('../${esc(t.cover || '')}')"></span>
        <div><h2>${esc(t.title?.en || t.slug)}</h2><small>${esc(t.place?.en || '')} · ${esc(nice(t.start))} – ${esc(nice(t.end))}</small></div>
        <span class="pills"><span class="pill ${t.when === 'past' ? 'past' : t.when === 'now' ? 'on' : 'off'}">${t.when === 'past' ? 'Ended' : t.when === 'now' ? 'Happening now' : 'Upcoming'}</span>
        <span class="pill ${ready ? 'on' : 'off'}">${ready ? 'Connected' : 'Not connected'}</span></span></div>

      <h3>${ready ? 'Expedition code' : 'Connect this expedition'}</h3>
      ${ready ? `<div class="codebox">${d.code ? `<span class="codeval">${esc(d.code)}</span><button class="btn ghost small" type="button" data-copy="${esc(d.code)}">Copy</button>`
            : '<span class="hint">Connected. Run the "show code" update in Supabase to see the code here.</span>'}</div>
        `
      : `<div class="row one"><label>The code this expedition opens with today<input class="code" data-secret spellcheck="false" autocapitalize="characters" placeholder="e.g. LYNX-2026" value="${esc(saved(t.slug))}"></label>
          <button class="btn" type="button" data-connect>Connect</button></div>
        ${saved(t.slug) ? '<p class="msg ok" style="margin:0">Found on this device: this browser already opened the expedition, so its code is filled in. Tap Connect.</p>' : ''}
        <p class="hint">Needed only once. The code is checked against the expedition before saving; after that travelers join with this code + their name.</p>`}
      <p class="msg" data-msg role="status"></p>

      <div class="trh"><h3>Travelers · ${trav.length}</h3>${ready ? `<button class="plus" type="button" data-plus aria-label="Add a traveler" title="Add a traveler"><svg viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></svg></button>` : ''}</div>
      ${ready ? `<form class="add" data-addform ${openAdd === t.slug ? '' : 'hidden'}><input data-names type="text" placeholder="Full name" autocomplete="off" spellcheck="false" aria-label="Traveler's full name"><button class="btn small" type="submit">Add</button></form>` : ''}
      ${rows.length ? `<div class="tbl"><table><thead><tr><th>Name</th><th>Status</th><th>Last active</th><th>Photos</th><th></th></tr></thead><tbody>
        ${rows.map(x => `<tr><td><a class="who" href="../${esc(t.path)}?as=${esc(x.m ? x.m.id : x.t.id)}" target="_blank" rel="noopener" title="Open ${esc(x.name)}'s view">${esc(x.name)}</a></td>
          <td><span class="st ${x.m ? (x.t ? 'in' : 'extra') : 'wait'}">${x.m ? (x.t ? 'Joined' : 'Not on list') : 'Not joined yet'}</span></td>
          <td>${x.m ? fmt(x.m.last_seen) : '–'}</td><td>${x.m ? x.m.photos : '–'}</td>
          <td><button class="btn danger small" type="button" ${x.t ? `data-rmt="${esc(x.t.id)}"` : `data-rm="${esc(x.m.id)}"`} data-name="${esc(x.name)}">Remove</button></td></tr>`).join('')}
        </tbody></table></div>` : `<p class="empty">${ready ? 'No travelers yet. Only names on this list can join: tap + to add one.' : 'No travelers yet.'}</p>`}

      <h3>Shared photos · ${tp.length}</h3>
      ${tp.length ? `<div class="gal">${tp.map(p => `<figure><img loading="lazy" src="${esc(urls[p.path.replace(/\.jpg$/, '_t.jpg')] || urls[p.path] || '')}" data-full="${esc(urls[p.path] || '')}" alt="">
          <figcaption>${esc(p.members?.name || '')} · ${esc(p.item_id.replace(/-/g, ' '))}</figcaption><button type="button" data-delph="${p.id}" data-path="${esc(p.path)}" aria-label="Delete photo">×</button></figure>`).join('')}</div>`
        : '<p class="empty">No photos yet.</p>'}
    </section>`;
  }).join('') || `<p class="empty">${term ? 'No expedition matches that search.' : 'No expeditions in tours.json.'}</p>`;
}

function say(el, t, c) { el.textContent = t; el.className = 'msg' + (c ? ' ' + c : ''); }

$('#tours').addEventListener('click', async e => {
  const card = e.target.closest('.card'); if (!card) return;
  const t = list[+card.dataset.i], msg = card.querySelector('[data-msg]');
  const btn = e.target.closest('button'); if (!btn) return;
  if (btn.matches('[data-connect]')) {
    const secret = card.querySelector('[data-secret]').value, code = secret;
    if (norm(secret).length < 4) return say(msg, 'Type the code this expedition opens with today.', 'err');
    btn.disabled = true; say(msg, 'Checking the code against the page…');
    try {
      if (!await opens(t.path, secret)) { btn.disabled = false; return say(msg, 'That code does not open this expedition. Check it and try again.', 'err'); }
      const { error } = await sb.rpc('admin_set_tour', { p_slug: t.slug, p_title: t.title?.en || t.slug, p_secret: secret, p_code: code });
      if (error) throw error;
      say(msg, 'Connected.', 'ok'); await load();
    } catch (err) { btn.disabled = false; say(msg, 'Could not save: ' + (err.message || err), 'err'); }
  }
  if (btn.matches('[data-copy]')) {
    try { await navigator.clipboard.writeText(btn.dataset.copy); btn.textContent = 'Copied'; setTimeout(() => { btn.textContent = 'Copy'; }, 1500); } catch (e) {}
    return;
  }
  if (btn.matches('[data-plus]')) {
    const f = card.querySelector('[data-addform]'); f.hidden = !f.hidden; openAdd = f.hidden ? null : t.slug;
    if (!f.hidden) f.querySelector('input').focus();
    return;
  }
  if (btn.matches('[data-rmt]')) {
    if (!confirm(`Remove ${btn.dataset.name} from this expedition's list? If they joined, their access, progress and photos go too.`)) return;
    const { error } = await sb.rpc('admin_remove_traveler', { p_id: btn.dataset.rmt });
    if (error) return say(msg, 'Could not remove: ' + error.message, 'err');
    await load(); return;
  }
  if (btn.matches('[data-rm]')) {
    if (!confirm(`Remove ${btn.dataset.name} from this expedition? Their progress and photos go too.`)) return;
    const { error } = await sb.rpc('admin_remove_member', { p_member: btn.dataset.rm });
    if (error) return say(msg, 'Could not remove: ' + error.message, 'err');
    await load();
  }
  if (btn.matches('[data-delph]')) {
    if (!confirm('Delete this photo for everyone?')) return;
    const p = btn.dataset.path;
    await sb.storage.from('tour-photos').remove([p, p.replace(/\.jpg$/, '_t.jpg')]);
    const { error } = await sb.from('photos').delete().eq('id', +btn.dataset.delph);
    if (error) return say(msg, 'Could not delete: ' + error.message, 'err');
    await load();
  }
});
// add a traveler: type the full name, Enter (several at once: separate with commas)
$('#tours').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, card = f.closest('.card'), t = list[+card.dataset.i], msg = card.querySelector('[data-msg]');
  const names = f.querySelector('input').value.split(/[,;\n]+/).map(n => n.trim()).filter(Boolean);
  if (!names.length) return f.querySelector('input').focus();
  const b = f.querySelector('button'); b.disabled = true;
  const { data, error } = await sb.rpc('admin_add_travelers', { p_slug: t.slug, p_names: names });
  b.disabled = false;
  if (error) return say(msg, /function/.test(error.message) ? 'Run supabase-update-travelers.txt in Supabase first.' : 'Could not add: ' + error.message, 'err');
  openAdd = t.slug; await load();
  const nf = document.querySelector(`.card[data-i="${card.dataset.i}"] [data-addform] input`); if (nf) nf.focus();
  if (data < names.length) say(document.querySelector(`.card[data-i="${card.dataset.i}"] [data-msg]`), 'Already on the list.', 'err');
});
$('#tours').addEventListener('click', e => {
  const img = e.target.closest('.gal img'); if (!img || !img.dataset.full) return;
  const z = document.createElement('div'); z.className = 'zoom'; z.innerHTML = `<img src="${esc(img.dataset.full)}" alt="">`; z.onclick = () => z.remove(); document.body.appendChild(z);
});

$('#login').addEventListener('submit', async e => {
  e.preventDefault();
  const m = $('#lmsg'); $('#go').disabled = true; say(m, 'Signing in…');
  const { error } = await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value });
  $('#go').disabled = false;
  if (error) return say(m, 'Wrong email or password.', 'err');
  say(m, ''); show(true);
});
$('#q').addEventListener('input', () => render());
$('#out').addEventListener('click', async () => { await sb.auth.signOut(); show(false); });

async function show(on) {
  $('#login').hidden = on; $('#app').hidden = !on; $('#out').hidden = !on;
  if (on) await load();
}
sb.auth.getSession().then(({ data }) => show(!!(data.session && !data.session.user.is_anonymous)));
})();
</script>
