<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MW Photo Tours · Expeditions</title>
<meta name="theme-color" content="#0A0908">
<link rel="icon" href="assets/favicon.ico" sizes="32x32"><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png"><script src="assets/sync.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400..700&family=Montserrat:wght@500;600;700&display=swap" media="print" onload="this.media='all'">
<style>
:root{
  --night:#0A0908; --forest-night:#0C2925; --paper:#FEFBF1; --off:#F4F4F4; --gold:#F4AF56; --gold-soft:#E4AA7C; --amber:#E8A23E; --leaf:#A9C48C;
  --muted:rgba(244,244,244,.78); --faint:rgba(244,244,244,.56); --rule:rgba(254,251,241,.14); --glass:rgba(10,9,8,.62);
  --sans:"Google Sans","Helvetica Neue",Arial,sans-serif; --label:"Montserrat","Google Sans","Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1); --pill:64px;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--night);color:var(--off);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

.page{position:relative;min-height:100vh;min-height:100dvh;display:grid;place-items:center;overflow:hidden;
  padding:calc(72px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));
  background:radial-gradient(130% 75% at 50% 0,#12403A 0,var(--forest-night) 38%,var(--night) 100%)}
.page::before{content:"";position:absolute;inset:0;background:url(assets/contour.webp) center/cover no-repeat;opacity:.09;pointer-events:none;animation:breathe 14s ease-in-out infinite alternate}
@keyframes breathe{to{transform:scale(1.06);opacity:.13}}
.in{position:relative;width:min(520px,100%);display:grid;justify-items:center;text-align:center;gap:14px}
.in>*{animation:rise .9s var(--ease) backwards;animation-delay:calc(var(--i,0) * 90ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.logo{display:block;width:88px;aspect-ratio:501/594;margin-bottom:8px;background:var(--paper);-webkit-mask:url(assets/logo-full.webp) center/contain no-repeat;mask:url(assets/logo-full.webp) center/contain no-repeat}
.lbl{margin:0;font:600 11.5px/1.4 var(--label);letter-spacing:.22em;text-transform:uppercase;color:var(--gold-soft)}
[dir=rtl] .lbl{font:600 13px/1.4 var(--sans);letter-spacing:.02em}
.tt{margin:0;font-size:clamp(34px,9vw,52px);font-weight:400;line-height:1.08;letter-spacing:-.015em;text-wrap:balance;
  background:linear-gradient(90deg,var(--paper),var(--gold-soft) 62%,#B9875F);-webkit-background-clip:text;background-clip:text;color:transparent}
[dir=rtl] .tt{background-image:linear-gradient(270deg,var(--paper),var(--gold-soft) 62%,#B9875F);letter-spacing:0}
.tt b{font-weight:700}
.lede{margin:0;color:var(--muted);font-size:16.5px;max-width:42ch}

/* the picker: the expeditions are always listed on the page; the search box only narrows them down.
   On a phone nothing needs the keyboard unless the traveler chooses to type. */
.pick{position:relative;width:100%;margin-top:14px;text-align:start}
.box{display:flex;align-items:center;gap:10px;height:56px;padding-inline:20px 8px;border-radius:var(--pill);border:1px solid rgba(254,251,241,.32);background:rgba(10,9,8,.5);transition:border-color .3s}
.box:focus-within{border-color:var(--gold)}
.box .ic{color:var(--gold-soft)}
.box input{flex:1;min-width:0;height:100%;border:0;background:none;outline:none;font-size:16px;color:var(--paper)}
.box input::placeholder{color:rgba(254,251,241,.45)}
.box button{width:40px;height:40px;border-radius:50%;border:0;background:none;color:var(--faint);display:grid;place-items:center;cursor:pointer;transition:transform .3s var(--ease),color .3s}
.box button:hover{color:var(--paper)}
.box button[hidden]{display:none}
.list{margin:12px 0 0;padding:6px;list-style:none;display:grid;gap:2px;border-radius:22px;background:rgba(14,22,20,.72);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--rule);box-shadow:0 22px 60px rgba(0,0,0,.35)}
.opt{display:grid;grid-template-columns:56px minmax(0,1fr) auto;align-items:center;gap:14px;padding:8px 10px 8px 8px;border-radius:16px;cursor:pointer;text-decoration:none;color:inherit;transition:background-color .2s}
[dir=rtl] .opt{padding:8px 8px 8px 10px}
.opt[aria-selected=true],.opt:hover{background:rgba(254,251,241,.07)}
.opt .ph{width:56px;height:56px;border-radius:12px;background:#1A2422 center/cover no-repeat;display:grid;place-items:center;color:var(--leaf)}
.opt b{display:block;font-size:16.5px;line-height:1.25;color:var(--paper)}
.opt small{display:block;font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}
.opt .st{font:600 10.5px/1 var(--label);letter-spacing:.14em;text-transform:uppercase;padding:6px 9px;border-radius:var(--pill);border:1px solid rgba(232,162,62,.5);color:var(--amber);white-space:nowrap}
[dir=rtl] .opt .st{font:600 12px/1 var(--sans);letter-spacing:0}
.opt .sts{display:grid;justify-items:end;gap:5px}
.opt .st.open{border-color:rgba(169,196,140,.55);color:var(--leaf);background:rgba(169,196,140,.08)}
.opt .st.now{border-color:rgba(169,196,140,.7);color:var(--leaf)}
.opt .st.past{border-color:var(--rule);color:var(--faint)}
.opt.past b{color:var(--muted)}
.opt mark{background:none;color:var(--gold);font-weight:inherit}
.empty{padding:18px 14px;color:var(--faint);font-size:14.5px;text-align:center}
.note{margin:6px 0 0;font-size:14px;color:var(--faint)}

.lang{position:absolute;top:calc(14px + env(safe-area-inset-top));inset-inline-end:14px;z-index:6;min-width:44px;height:36px;padding-inline:12px;border-radius:var(--pill);border:1px solid var(--rule);background:rgba(10,9,8,.35);color:var(--paper);font:600 12px/1 var(--label);letter-spacing:.12em;cursor:pointer}
.go{position:fixed;inset:0;z-index:20;background:var(--night);opacity:0;pointer-events:none;transition:opacity .45s}
.go.on{opacity:1}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="m6.5 6.5 11 11m0-11-11 11"/></symbol>
  <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M5 19c0-8 5-13.5 14.5-14.5C19 14 13.5 19 5.5 19z"/><path d="M5 19c3-4 6-6.5 9.5-8.5"/></symbol>
</svg>
<main class="page">
  <button class="lang" type="button" id="lang"></button>
  <div class="in">
    <span class="logo" role="img" aria-label="MW Photo Tours" style="--i:0"></span>
    <p class="lbl" id="kicker" style="--i:1"></p>
    <h1 class="tt" id="title" style="--i:2"></h1>
    <p class="lede" id="lede" style="--i:3"></p>
    <div class="pick" id="pick" style="--i:4">
      <div class="box">
        <svg class="ic"><use href="#i-search"/></svg>
        <input id="q" type="search" enterkeyhint="go" role="combobox" aria-expanded="true" aria-controls="list" aria-autocomplete="list" autocomplete="off" spellcheck="false">
        <button type="button" id="clear" hidden><svg class="ic"><use href="#i-x"/></svg></button>
      </div>
      <ul class="list" id="list" role="listbox"></ul>
    </div>
    <p class="note" id="note" style="--i:5"></p>
  </div>
  <div class="go" id="go"></div>
</main>
<script>
(() => {
const UI = {
  he: { lang: 'EN', kicker: 'MW Photo Tours · מסעות צילום', title: '<span>לאיזה מסע</span> <b>אתם מצטרפים?</b>', lede: 'בחרו את המסע שלכם מהרשימה, או חפשו לפי שם, מקום או חודש.',
        ph: 'חיפוש מסע…', note: 'אחרי הבחירה תתבקשו להקליד את קוד המסע שמתן שלח לכם.', empty: 'לא נמצא מסע. נסו מילה אחרת.', loadErr: 'לא הצלחנו לטעון את רשימת המסעות. רעננו את הדף.',
        st: { soon: 'בקרוב', now: 'עכשיו', past: 'הסתיים' }, open: 'פתוח', months: ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'] },
  en: { lang: 'עב', kicker: 'MW Photo Tours · Photography expeditions', title: '<span>Which expedition</span> <b>are you joining?</b>', lede: 'Choose your expedition from the list, or search by name, place or month.',
        ph: 'Search expeditions…', note: 'Next, you’ll be asked for the expedition code Matan sent you.', empty: 'No expedition found. Try another word.', loadErr: 'We couldn’t load the expeditions. Please refresh the page.',
        st: { soon: 'Upcoming', now: 'Now', past: 'Ended' }, open: 'Unlocked', months: ['January','February','March','April','May','June','July','August','September','October','November','December'] },
};
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
let lang = store.get('mw-tour-lang') === 'en' ? 'en' : 'he', L = UI[lang], tours = [], shown = [], active = -1;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const tx = o => o && typeof o === 'object' ? (o[lang] ?? o.en ?? o.he ?? '') : (o ?? '');
const pick = $('#pick'), q = $('#q'), list = $('#list');

const day = s => { const [y, m, d] = s.split('-').map(Number); return { y, m, d }; };
function dates(t) {
  if (!t.start) return '';
  const a = day(t.start), b = t.end ? day(t.end) : a, M = L.months;
  if (a.y === b.y && a.m === b.m) return `${a.d}–${b.d} ${M[a.m - 1]} ${a.y}`;
  if (a.y === b.y) return `${a.d} ${M[a.m - 1]} – ${b.d} ${M[b.m - 1]} ${a.y}`;
  return `${a.d} ${M[a.m - 1]} ${a.y} – ${b.d} ${M[b.m - 1]} ${b.y}`;
}
function status(t) {
  const today = new Date().toISOString().slice(0, 10);
  if (t.end && today > t.end) return 'past';
  if (t.start && today >= t.start) return 'now';
  return 'soon';
}
// everything a traveler might type: both languages, the place, the month names
const hay = t => [t.title?.en, t.title?.he, t.place?.en, t.place?.he, t.path, ...['en', 'he'].map(l => { const k = lang; lang = l; L = UI[l]; const d = dates(t); lang = k; L = UI[k]; return d; })].join(' ').toLowerCase();
const norm = s => s.toLowerCase().trim();
function hl(text, term) {
  if (!term) return esc(text);
  const i = text.toLowerCase().indexOf(term);
  return i < 0 ? esc(text) : esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + term.length)) + '</mark>' + esc(text.slice(i + term.length));
}

function render() {
  const term = norm(q.value);
  const order = { now: 0, soon: 1, past: 2 };
  shown = tours.filter(t => !term || hay(t).includes(term))
    .sort((a, b) => order[status(a)] - order[status(b)] || (status(a) === 'past' ? (b.start || '').localeCompare(a.start || '') : (a.start || '').localeCompare(b.start || '')));
  active = term && shown.length ? 0 : -1;   // highlight the top match only while searching
  list.innerHTML = shown.length ? shown.map((t, i) => {
    const st = status(t);
    return `<li><a class="opt${st === 'past' ? ' past' : ''}" id="o${i}" role="option" aria-selected="${i === active}" href="${esc(t.path)}">
      <span class="ph"${t.cover ? ` style="background-image:url('${esc(t.cover)}')"` : ''}>${t.cover ? '' : '<svg class="ic"><use href="#i-leaf"/></svg>'}</span>
      <span><b>${hl(tx(t.title), term)}</b><small>${hl(tx(t.place), term)}${t.place ? ' · ' : ''}${esc(dates(t))}</small></span>
      <span class="sts"><span class="st ${st}">${esc(L.st[st])}</span></span></a></li>`;
  }).join('') : `<li class="empty">${esc(tours.length ? L.empty : L.loadErr)}</li>`;
  q.setAttribute('aria-activedescendant', active >= 0 ? 'o' + active : '');
}
// already unlocked on this device (or brought here by signing in): no code needed
const isOpen = t => { try { return !!(t.slug && localStorage.getItem('mw-tour-' + t.slug + '-code')); } catch (e) { return false; } };
const coarse = matchMedia('(pointer:coarse)');
function move(d) {
  if (!shown.length) return;
  active = (active + d + shown.length) % shown.length;
  list.querySelectorAll('.opt').forEach((o, i) => o.setAttribute('aria-selected', i === active));
  const el = $('#o' + active); el && el.scrollIntoView({ block: 'nearest' });
  q.setAttribute('aria-activedescendant', 'o' + active);
}
function go(t) {
  if (!t) return;
  $('#go').classList.add('on');
  setTimeout(() => { location.href = t.path; }, matchMedia('(prefers-reduced-motion:reduce)').matches ? 0 : 380);
}

function applyLang() {
  L = UI[lang];
  document.documentElement.lang = lang; document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr';
  $('#lang').textContent = L.lang;
  $('#kicker').textContent = L.kicker; $('#title').innerHTML = L.title; $('#lede').textContent = L.lede; $('#note').textContent = L.note;
  q.placeholder = L.ph; q.setAttribute('aria-label', L.ph);
  render();
}

// on a phone, typing lifts the search box to the top so the matches show above the keyboard
q.addEventListener('focus', () => { if (coarse.matches) setTimeout(() => pick.scrollIntoView({ block: 'start', behavior: 'smooth' }), 280); });
q.addEventListener('input', () => { $('#clear').hidden = !q.value; render(); });
q.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
  else if (e.key === 'Enter') { e.preventDefault(); if (active >= 0) go(shown[active]); else q.blur(); }
  else if (e.key === 'Escape') { q.value = ''; $('#clear').hidden = true; render(); }
});
$('#clear').addEventListener('click', () => { q.value = ''; $('#clear').hidden = true; render(); q.blur(); });
list.addEventListener('click', e => { const a = e.target.closest('.opt'); if (!a) return; e.preventDefault(); go(shown[+a.id.slice(1)]); });
// starting to scroll or tap the list puts the keyboard away
list.addEventListener('touchstart', () => q.blur(), { passive: true });
$('#lang').addEventListener('click', () => { lang = lang === 'he' ? 'en' : 'he'; store.set('mw-tour-lang', lang); applyLang(); });
addEventListener('pageshow', () => { $('#go').classList.remove('on'); render(); });
addEventListener('mw-sync', () => { lang = store.get('mw-tour-lang') === 'en' ? 'en' : 'he'; applyLang(); });   // signed in: language and unlocked tours from the account

applyLang();
fetch('tours.json', { cache: 'no-cache' }).then(r => r.json()).then(d => { tours = (d.tours || []).filter(t => t && t.path); render(); })
  .catch(() => render());
})();
</script>
</body>
</html>
