<title>מאנאס וקזירנגה (Copy)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<!-- the fonts load beside the page, not in front of it: on a slow connection the text shows at once and swaps in -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400..700&family=Montserrat:wght@500;600;700&display=swap" media="print" onload="this.media='all'">
<style>
/* MW Photo Tours brand book v3 (30.9.2026): night to dawn, two-weight titles in one gradient, contour lines,
   line icons in thin rings, pill buttons with one gold primary. Wild animals only in real photographs. */
:root{
  /* Layout: the map is the whole stage. A slim day timeline and one small card sit at its foot; the other rooms
     (stories, field, essentials, leader) move from night through earth, forest and petrol to the fog of dawn. */
  --night:#0A0908; --forest-night:#0C2925; --petrol:#023C4C; --petrol-deep:#0A282E; --earth-deep:#1A0B02; --bark-deep:#24120B;
  --fog:#9CB1C2; --fog-light:#CDD7DD; --stone:#91A3AF; --off:#F4F4F4; --paper:#FEFBF1; --cream:#EBE7DE;
  --gold:#F4AF56; --gold-soft:#E4AA7C; --sunset:#E89843; --earth:#6F3D2E; --bark:#3F1715; --navy:#1E334E; --wa:#25D366;
  /* this expedition's two accents: the forest of Manas, and the amber of a leopard's eye */
  --forest:#7C9A5E; --leaf:#A9C48C; --amber:#E8A23E;
  --muted:rgba(244,244,244,.78); --faint:rgba(244,244,244,.56); --rule:rgba(254,251,241,.14); --glass:rgba(10,9,8,.7);
  --sans:"Google Sans","Google Sans Flex","Helvetica Neue",Arial,sans-serif;
  --label:"Montserrat","Google Sans","Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1); --spring:cubic-bezier(.34,1.56,.64,1); --pill:64px; --top:56px; --bar:64px;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--off);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* two weights, one gradient: light and warm where the line starts, fading toward its end */
.tt{margin:0;font-weight:400;line-height:1.05;letter-spacing:-.015em;text-wrap:balance;
  background:linear-gradient(var(--tt-dir,90deg),var(--paper),var(--gold-soft) 62%,#B9875F);-webkit-background-clip:text;background-clip:text;color:transparent}
.tt b{font-weight:700}
.tt.silver{background-image:linear-gradient(var(--tt-dir,90deg),var(--off) 20%,rgba(244,244,244,.46))}
.tt.ink{background-image:linear-gradient(var(--tt-dir,90deg),#7A4330,var(--bark))}
[dir=rtl] .tt{--tt-dir:270deg;letter-spacing:0}
.lbl{margin:0;font:600 11.5px/1.4 var(--label);letter-spacing:.22em;text-transform:uppercase;color:var(--gold-soft)}
[dir=rtl] .lbl{font:600 13px/1.4 var(--sans);letter-spacing:.02em}

.logo{display:block;background:var(--paper);-webkit-mask:url(img/logo-full.webp) center/contain no-repeat;mask:url(img/logo-full.webp) center/contain no-repeat}
.mark{display:block;background:var(--paper);-webkit-mask:url(img/logo-mark.webp) center/contain no-repeat;mask:url(img/logo-mark.webp) center/contain no-repeat}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding-inline:22px;border-radius:var(--pill);border:1px solid rgba(244,244,244,.4);background:transparent;color:var(--off);font:700 15px/1 var(--sans);cursor:pointer;text-decoration:none;white-space:nowrap;transition:background-color .3s,border-color .3s,color .3s,transform .3s var(--ease)}
.btn:hover{border-color:var(--off)}
.btn:active{transform:scale(.97)}
.btn.primary{border-color:var(--gold);background:radial-gradient(130% 160% at 0 0,rgba(244,175,86,.24),transparent 46%)}
[dir=rtl] .btn.primary{background:radial-gradient(130% 160% at 100% 0,rgba(244,175,86,.24),transparent 46%)}
.btn.primary:hover{background-color:rgba(244,175,86,.1)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:var(--night)}
.btn.small{min-height:38px;padding-inline:16px;font-size:13px}
.toggle{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding-inline:14px;border-radius:var(--pill);border:1px solid rgba(254,251,241,.35);background:none;color:var(--paper);font:700 13px/1 var(--sans);cursor:pointer;transition:background-color .3s,border-color .3s,color .3s,transform .3s var(--ease)}
.toggle .ic{width:16px;height:16px}
.toggle:active{transform:scale(.96)}
.toggle[aria-pressed=true]{background:var(--forest);border-color:var(--forest);color:var(--night)}
.toggle[aria-pressed=true] .ic{animation:tick .4s var(--spring)}
@keyframes tick{50%{transform:scale(1.3)}}
.ring{width:42px;height:42px;flex:none;border-radius:50%;border:1.5px solid rgba(254,251,241,.55);display:grid;place-items:center;color:var(--paper)}
.ring .ic{width:18px;height:18px}
.kind{font:600 11px/1 var(--label);letter-spacing:.22em;text-transform:uppercase;color:var(--gold-soft)}
[dir=rtl] .kind{font:600 13px/1 var(--sans);letter-spacing:.02em}
.k-wildlife{--k:var(--leaf)} .k-legend{--k:var(--amber)} .k-history{--k:var(--fog)} .k-culture{--k:var(--gold-soft)} .k-food{--k:var(--sunset)} .k-place{--k:var(--paper)}
.kind[class*=k-]{color:var(--k)}
.k .ring,.story>.k .ring{color:var(--k,var(--paper));border-color:color-mix(in srgb,var(--k,var(--paper)) 62%,transparent)}
figure.ph{margin:0;position:relative;overflow:hidden;border-radius:14px;background:#14120F}
figure.ph img{display:block;width:100%;height:100%;object-fit:cover}
figure.ph figcaption{position:absolute;inset-inline-end:10px;bottom:8px;font:500 11px/1.3 var(--label);letter-spacing:.14em;text-transform:uppercase;color:rgba(244,244,244,.85);text-shadow:0 1px 6px rgba(10,9,8,.85)}
[dir=rtl] figure.ph figcaption{font:500 12px/1.3 var(--sans);letter-spacing:.02em}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ---------- gate ---------- */
#gate{position:fixed;inset:0;z-index:60;display:grid;place-items:center;overflow-y:auto;padding-block:calc(28px + env(safe-area-inset-top)) calc(28px + env(safe-area-inset-bottom));padding-inline:20px;
  background:radial-gradient(130% 75% at 50% 0,#12403A 0,var(--forest-night) 38%,var(--night) 100%)}
#gate::before{content:"";position:absolute;inset:0;background:url(img/contour.webp) center/cover no-repeat;opacity:.09;pointer-events:none;animation:breatheBg 14s ease-in-out infinite alternate}
@keyframes breatheBg{to{transform:scale(1.06);opacity:.13}}
.gate-in{position:relative;width:min(400px,100%);display:grid;justify-items:center;text-align:center;gap:16px}
.gate-in>*{animation:rise .9s var(--ease) backwards;animation-delay:calc(var(--i,0) * 90ms)}
.gate-in .logo{width:96px;aspect-ratio:501/594;margin-block-end:10px}
.gate-in .tt{font-size:clamp(42px,12vw,60px)}
.gate-in .dates{margin:0;color:var(--muted);font-size:17px}
.gate-form{width:100%;display:grid;gap:12px;margin-block-start:18px}
.gate-form label{font-size:14px;color:var(--muted)}
.gate-form input{width:100%;height:54px;border-radius:var(--pill);border:1px solid rgba(254,251,241,.32);background:rgba(10,9,8,.45);text-align:center;font:600 18px/1 var(--label);letter-spacing:.24em;text-transform:uppercase;color:var(--paper);transition:border-color .3s}
.gate-form input::placeholder{color:rgba(254,251,241,.3);letter-spacing:.24em}
.gate-form input:focus{outline:none;border-color:var(--gold)}
.gate-form.shake input{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.gate-form .btn{width:100%}
.gate-note{margin:0;font-size:14px;color:var(--faint)}
.gate-all{margin-top:6px;font-size:14px;font-weight:700;color:var(--gold-soft);text-decoration:underline;text-decoration-color:rgba(228,170,124,.4);text-underline-offset:4px}
.gate-err{margin:0;min-height:1.6em;font-size:14px;color:var(--gold)}
#gate.leave{animation:gateOut .9s var(--ease) forwards}
@keyframes gateOut{to{opacity:0;transform:scale(1.04);visibility:hidden}}
.lang{position:absolute;top:calc(12px + env(safe-area-inset-top));inset-inline-end:12px;z-index:2}
.outbtn{width:36px;height:36px;flex:none;padding:0;border-radius:50%;border:1px solid var(--rule);background:rgba(10,9,8,.35);color:var(--paper);display:grid;place-items:center;cursor:pointer;transition:border-color .3s}
.outbtn:hover{border-color:rgba(254,251,241,.5)}
.outbtn .ic{width:17px;height:17px}
[dir=rtl] .outbtn .ic{transform:scaleX(-1)}
.langbtn{min-width:44px;height:36px;padding-inline:12px;border-radius:var(--pill);border:1px solid var(--rule);background:rgba(10,9,8,.35);color:var(--paper);font:600 12px/1 var(--label);letter-spacing:.12em;cursor:pointer}

/* ---------- shell ---------- */
#shell{position:fixed;inset:0}
.top{position:fixed;top:0;inset-inline:0;z-index:25;height:calc(var(--top) + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);padding-inline:14px;display:flex;align-items:center;gap:10px;
  background:linear-gradient(rgba(10,9,8,.86),rgba(10,9,8,.55));-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--rule);transition:transform .8s var(--ease)}
.top .mark{width:24px;aspect-ratio:501/535}
.top .name{min-width:0;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;background:none;cursor:pointer;font-family:inherit;padding-inline:10px;border-radius:var(--pill);border:1px solid rgba(232,162,62,.45);color:var(--paper);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip .ic{width:14px;height:14px;color:var(--amber)}
.backbtn{position:fixed;z-index:26;top:calc(var(--top) + env(safe-area-inset-top) + 20px);inset-inline-start:12px;box-shadow:0 8px 24px rgba(0,0,0,.4);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);display:inline-flex;align-items:center;gap:4px;height:36px;padding-inline:8px 14px;border-radius:var(--pill);border:1px solid rgba(244,175,86,.55);background:rgba(10,9,8,.72);color:var(--paper);font:700 14px/1 var(--sans);cursor:pointer;white-space:nowrap;height:40px;transition:background-color .3s,transform .3s var(--ease)}
.backbtn{width:44px;height:44px!important;padding:0!important;justify-content:center;border-radius:50%}
.backbtn span{display:none}
.backbtn .ic{width:22px!important;height:22px!important}
.back-on-map .mfilter{inset-inline-start:66px}
.backbtn:hover{background:rgba(30,24,18,.86)}
.backbtn:active{transform:scale(.96)}
.backbtn .ic{width:18px;height:18px;color:var(--gold)}
[dir=rtl] .backbtn .ic{transform:scaleX(-1)}
.top .end{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.tabs{position:fixed;inset-inline:0;bottom:0;z-index:30;height:calc(var(--bar) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(5,1fr);
  background:rgba(10,9,8,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--rule);transition:transform .8s var(--ease)}
.tabs button{position:relative;display:grid;justify-items:center;align-content:center;gap:5px;min-width:0;border:0;background:none;color:var(--faint);font:500 11.5px/1 var(--sans);cursor:pointer;transition:color .3s;white-space:nowrap}
.tabs button .ic{width:22px;height:22px;transition:transform .4s var(--spring),color .3s}
.tabs button[aria-selected=true]{color:var(--paper)}
.tabs button[aria-selected=true] .ic{color:var(--amber);transform:translateY(-2px)}
.room{position:absolute;inset:0}
.room.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:calc(var(--top) + env(safe-area-inset-top) + 36px) calc(var(--bar) + env(safe-area-inset-bottom) + 56px);padding-inline:16px}
.room [id]{scroll-margin-top:calc(var(--top) + env(safe-area-inset-top) + 18px)}
.room.scroll::before{content:"";position:fixed;inset:0;background:url(img/contour.webp) center/cover no-repeat;opacity:.07;pointer-events:none}
.room.enter .wrap>*{animation:rise .8s var(--ease) backwards;animation-delay:calc(var(--i,0) * 70ms)}
.wrap{position:relative;max-width:1080px;margin-inline:auto;display:grid;gap:56px}
.rh{display:grid;gap:12px;max-width:720px}
.rh .tt{font-size:clamp(38px,8vw,72px)}
.lede{margin:0;color:var(--muted);font-size:17px;max-width:60ch}

/* ---------- route: the map ---------- */
#map{position:absolute;inset:0;overflow:hidden;overflow:clip;background:linear-gradient(180deg,#03060C 0,#0A1118 34%,#121A18 58%,var(--night) 100%);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;--night-a:0;--dawn-a:0;--stars-a:0;--tilt:0deg;--tz:1}
#map.drag{cursor:grabbing}
/* the camera can lean into the landscape for the flights, like a plane window */
.stage{position:absolute;inset:0;transform-origin:50% 64%;transform:perspective(1200px) rotateX(var(--tilt)) scale(var(--tz));
  /* the far edge of a tilted map dissolves into the sky, like a horizon */
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 calc(var(--tilt-k,0) * 30%));mask-image:linear-gradient(180deg,transparent 0,#000 calc(var(--tilt-k,0) * 30%))}
#map.titling .ov{opacity:0}
#mapsvg{position:absolute;inset:0;width:100%;height:100%;display:block}
#mapsvg .bd{fill:none;stroke:rgba(254,251,241,.38);stroke-width:calc(var(--px) * 1);stroke-dasharray:calc(var(--px) * 4) calc(var(--px) * 3)}
#mapsvg .st{fill:none;stroke:rgba(254,251,241,.2);stroke-width:calc(var(--px) * .8);stroke-dasharray:calc(var(--px) * 1.5) calc(var(--px) * 3)}
#mapsvg .rv{fill:none;stroke:#3C7484;stroke-opacity:.75;stroke-width:calc(var(--px) * 1.2);stroke-linecap:round;stroke-linejoin:round}
#mapsvg .rv.big{stroke:#3F7C8C;stroke-opacity:.82;stroke-width:max(calc(var(--px) * 2.2),3.4px)}
/* the Brahmaputra flows: light dashes drifting downstream */
#mapsvg .flow{fill:none;stroke:rgba(200,236,244,.5);stroke-width:max(calc(var(--px) * .9),1.1px);stroke-linecap:round;stroke-dasharray:calc(var(--px) * 3) calc(var(--px) * 22);animation:flow 5s linear infinite}
@keyframes flow{to{stroke-dashoffset:calc(var(--px) * -50)}}
#mapsvg .ghost{fill:none;stroke:rgba(254,251,241,.4);stroke-width:calc(var(--px) * 1.3);stroke-dasharray:calc(var(--px) * 1.5) calc(var(--px) * 4.5);stroke-linecap:round}
#mapsvg .case{fill:none;stroke:rgba(10,9,8,.72);stroke-width:calc(var(--px) * 7);stroke-linecap:round;stroke-linejoin:round}
#mapsvg .ink{fill:none;stroke:var(--amber);stroke-width:calc(var(--px) * 3.2);stroke-linecap:round;stroke-linejoin:round}
#mapsvg .ink.fl{stroke-width:calc(var(--px) * 1.8);stroke-dasharray:calc(var(--px) * 7) calc(var(--px) * 5)}
#tint{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(130% 75% at 50% -12%,rgb(232 152 67 / var(--dawn-a)) 0,rgb(218 125 43 / calc(var(--dawn-a) * .45)) 36%,transparent 72%),
  linear-gradient(180deg,rgb(2 7 20 / var(--night-a)),rgb(6 12 28 / calc(var(--night-a) * .82)))}
#stars{position:absolute;inset:0;width:100%;height:100%;opacity:var(--stars-a);pointer-events:none}
/* weather and life over the land: drifting cloud shadows, morning mist, now and then a flock of birds */
.sky{position:absolute;inset:-12%;pointer-events:none;opacity:0}
.sky i{position:absolute;border-radius:50%;will-change:transform}
#clouds i{background:radial-gradient(closest-side,rgba(6,8,10,.36),rgba(6,8,10,.14) 55%,transparent);animation:cloud 110s linear infinite}
#clouds i:nth-child(1){width:60%;height:34%;left:-60%;top:8%}
#clouds i:nth-child(2){width:46%;height:28%;left:-60%;top:46%;animation-duration:140s;animation-delay:-60s}
#clouds i:nth-child(3){width:70%;height:30%;left:-60%;top:70%;animation-duration:170s;animation-delay:-110s}
#clouds i:nth-child(4){width:40%;height:22%;left:-60%;top:28%;animation-duration:125s;animation-delay:-30s;background:radial-gradient(closest-side,rgba(240,244,240,.1),transparent)}
@keyframes cloud{to{transform:translate3d(260%,-12%,0)}}
#mist i{background:radial-gradient(closest-side,rgba(226,234,230,.2),rgba(226,234,230,.07) 55%,transparent);animation:drift 44s ease-in-out infinite alternate}
#mist i:nth-child(1){width:75%;height:36%;left:-12%;top:26%}
#mist i:nth-child(2){width:62%;height:30%;left:42%;top:46%;animation-duration:57s;animation-delay:-18s}
#mist i:nth-child(3){width:90%;height:32%;left:6%;top:64%;animation-duration:69s;animation-delay:-36s}
#mist i:nth-child(4){width:50%;height:24%;left:30%;top:12%;animation-duration:51s;animation-delay:-9s}
@keyframes drift{from{transform:translate3d(-7%,1%,0)}to{transform:translate3d(9%,-3%,0)}}
#birds{position:absolute;inset:0;pointer-events:none;opacity:0;overflow:hidden}
#birds .flock{position:absolute;left:-14%;top:58%;width:90px;height:44px;animation:flock 26s linear infinite;animation-delay:6s}
[dir=rtl] #birds .flock{animation-name:flockR;left:auto;right:-14%}
#birds svg{width:100%;height:100%;overflow:visible}
#birds path{fill:none;stroke:rgba(254,251,241,.75);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center;animation:flap .55s ease-in-out infinite alternate}
#birds path:nth-child(2n){animation-delay:-.2s}#birds path:nth-child(3n){animation-delay:-.35s}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.35)}}
@keyframes flock{0%{transform:translate3d(0,0,0)}55%{transform:translate3d(70vw,-26vh,0)}100%{transform:translate3d(130vw,-40vh,0)}}
@keyframes flockR{0%{transform:translate3d(0,0,0) scaleX(-1)}55%{transform:translate3d(-70vw,-26vh,0) scaleX(-1)}100%{transform:translate3d(-130vw,-40vh,0) scaleX(-1)}}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(130% 100% at 50% 50%,transparent 60%,rgba(10,9,8,.42))}

.ov{pointer-events:none;transition:opacity 1s}
.ov>*{position:absolute;left:0;top:0;will-change:transform;transition:opacity .45s,visibility .45s}
.ov>.off{opacity:0;visibility:hidden}
.ov button{pointer-events:auto}
.lab>span{display:block;transform:translate(-50%,-50%);white-space:nowrap;color:rgba(254,251,241,.62);font:600 11px/1 var(--label);letter-spacing:.26em;text-transform:uppercase;text-shadow:0 1px 3px rgba(10,9,8,.95),0 0 12px rgba(10,9,8,.7)}
[dir=rtl] .lab>span{font:500 13px/1 var(--sans);letter-spacing:.04em}
.lab.sea>span{color:rgba(156,177,194,.6);font-weight:500;letter-spacing:.32em}
.lab.city>span{letter-spacing:.14em;font-size:10px;color:rgba(254,251,241,.72)}
.lab.river>span{color:rgba(160,214,228,.9);letter-spacing:.2em;font-size:10px}
.lab.region>span{color:rgba(254,251,241,.45);letter-spacing:.34em}
[dir=rtl] .lab.city>span,[dir=rtl] .lab.river>span,[dir=rtl] .lab.region>span,[dir=rtl] .lab.sea>span{font-size:12px;letter-spacing:.03em}
.dot{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--paper);box-shadow:0 0 0 3px rgba(10,9,8,.65)}
.dot::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:1.5px solid var(--paper);opacity:0}
.ping .dot::after{animation:ripple 2.2s var(--ease) 1}
@keyframes ripple{0%{transform:scale(1);opacity:.9}100%{transform:scale(4.2);opacity:0}}
.mk .tag{position:absolute;left:0;top:0;transform:translate(12px,-50%);display:inline-flex;align-items:center;gap:7px;height:28px;padding-inline:10px;border-radius:var(--pill);background:rgba(10,9,8,.82);border:1px solid var(--rule);white-space:nowrap;font-size:12.5px;font-weight:700;color:var(--paper);cursor:pointer;transition:border-color .3s,background-color .3s}
.mk .tag:hover,.mk.sel .tag{border-color:rgba(232,162,62,.8);background:rgba(10,9,8,.94)}
.mk .tag b{font:700 10px/1 var(--label);letter-spacing:.18em;color:var(--gold-soft)}
.mk .tag small{font-size:11px;font-weight:500;color:var(--faint)}
.mk.ap .dot{width:8px;height:8px;margin:-4px 0 0 -4px}
.mk.short .tag{transform:translate(calc(-100% - 10px),-50%);padding-inline:8px}
.spot{pointer-events:none;opacity:0;transition:opacity .6s;z-index:3}
.spot.show{opacity:1}
.spot i{position:absolute;left:-26px;top:-26px;width:52px;height:52px;border-radius:50%;border:2px solid var(--amber);background:rgba(232,162,62,.14);box-shadow:0 0 0 3px rgba(10,9,8,.35)}
.spot i::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--amber);animation:breathe 2.4s ease-out infinite}
.spot b{position:absolute;left:0;top:-64px;transform:translateX(-50%);height:28px;padding-inline:12px;display:inline-flex;align-items:center;border-radius:var(--pill);background:var(--amber);color:var(--night);font:700 12.5px/1 var(--sans);white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.mk.here .dot{background:var(--amber);box-shadow:0 0 0 3px rgba(10,9,8,.65)}
.mk.here .dot::before{content:"";position:absolute;inset:-7px;border-radius:50%;background:rgba(232,162,62,.25);animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{transform:scale(1.5);opacity:.35}}
.cnt{position:absolute;left:0;top:0;width:34px;height:34px;margin:-46px 0 0 -17px;padding:0;border-radius:50%;border:1.5px solid var(--amber);background:rgba(10,9,8,.86);color:var(--paper);display:grid;place-items:center;font:700 13px/1 var(--label);cursor:pointer;transition:transform .35s var(--spring),opacity .4s}
.cnt::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:1.5px solid var(--amber);animation:breathe 2.8s ease-out infinite}
.cnt:hover{transform:scale(1.12)}
.cnt.gone{opacity:0;transform:scale(.4);pointer-events:none}
.clu{width:56px;height:56px;margin:-28px 0 0 -28px;padding:0;border-radius:50%;border:1.5px solid var(--amber);background:rgba(10,9,8,.86);color:var(--paper);display:grid;place-items:center;cursor:pointer;font:700 16px/1 var(--label)}
.clu::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:1.5px solid var(--amber);animation:breathe 2.8s ease-out infinite}
.clu .t{position:absolute;left:66px;top:50%;transform:translateY(-50%);height:28px;padding-inline:10px;display:inline-flex;align-items:center;border-radius:var(--pill);background:rgba(10,9,8,.8);border:1px solid var(--rule);font:700 12.5px/1 var(--sans);white-space:nowrap}
@keyframes breathe{0%{transform:scale(1);opacity:.6}75%,100%{transform:scale(1.75);opacity:0}}
.pin{width:32px;height:32px;margin:-16px 0 0 -16px;border:0;padding:0;background:none;cursor:pointer;border-radius:50%;color:var(--k)}
.pin>.b{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;background:rgba(10,9,8,.8);border:1.5px solid currentColor;transition:transform .35s var(--spring),background-color .3s;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.pin>.b::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:1px solid currentColor;opacity:0;animation:breathe 3.8s ease-out infinite;animation-delay:var(--dl,0s)}
.pin .ic{width:15px;height:15px;color:var(--paper)}
.pin:hover>.b,.pin.sel>.b{transform:scale(1.22);background:rgba(10,9,8,.95)}
.pin.sel>.b{box-shadow:0 0 0 6px color-mix(in srgb,currentColor 22%,transparent)}
.pin.pop>.b{animation:pop .75s var(--spring) backwards;animation-delay:var(--pd,0s)}
@keyframes pop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.2);opacity:1}100%{transform:scale(1)}}
.pin .tip{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translate(-50%,4px);padding:6px 10px;border-radius:10px;background:rgba(10,9,8,.92);border:1px solid var(--rule);color:var(--paper);font:600 12.5px/1.2 var(--sans);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s var(--ease)}
.pin:hover .tip,.pin:focus-visible .tip{opacity:1;transform:translate(-50%,0)}
.pin.seen>.b::before{content:"";position:absolute;right:-3px;top:-3px;width:10px;height:10px;border-radius:50%;background:var(--forest);box-shadow:0 0 0 2px rgba(10,9,8,.9)}
.pin.has-ph{width:38px;height:38px;margin:-19px 0 0 -19px}
.pin.has-ph>.b{background:center/cover no-repeat;border-width:2px;box-shadow:0 0 0 2px rgba(10,9,8,.7),0 4px 14px rgba(0,0,0,.45)}
.pin.has-ph>.b>.ic{display:none}
.pin.has-ph>.b>i{position:absolute;inset-inline-end:-5px;bottom:-5px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:rgba(10,9,8,.92);border:1.5px solid currentColor}
.pin.has-ph>.b>i .ic{display:block;width:10px;height:10px}
.veh .halo{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;background:radial-gradient(closest-side,rgba(244,175,86,.55),rgba(244,175,86,0));animation:glow 1.6s ease-in-out infinite}
.veh .v{position:absolute;left:-15px;top:-15px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(10,9,8,.88);border:1.5px solid var(--amber);color:var(--amber)}
.veh .v .ic{width:17px;height:17px}
.veh .vl{position:absolute;left:20px;top:-11px;height:22px;padding-inline:8px;display:inline-flex;align-items:center;border-radius:var(--pill);background:rgba(10,9,8,.86);font:700 10px/1 var(--label);letter-spacing:.16em;color:var(--paper);white-space:nowrap}
.veh .vl:empty{display:none}
.paw{opacity:0;animation:paw 3.4s ease forwards;animation-delay:var(--pd,0s)}
.paw .ic{width:15px;height:15px;color:var(--leaf);margin:-7px 0 0 -7px;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
@keyframes paw{0%{opacity:0}12%{opacity:.95}70%{opacity:.85}100%{opacity:0}}
.credit{margin:-4px 0 0;max-width:100%;font-size:9px;line-height:1.2;color:rgba(254,251,241,.42);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none!important;text-shadow:0 1px 3px rgba(0,0,0,.85)}

.mapctl{position:absolute;top:calc(var(--top) + env(safe-area-inset-top) + 22px);inset-inline-end:12px;z-index:4;display:grid;gap:8px;transition:opacity .6s,transform .8s var(--ease)}
.icbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--rule);color:var(--paper);cursor:pointer;padding:0;transition:border-color .3s,transform .3s var(--spring)}
.icbtn:hover{border-color:rgba(254,251,241,.5);transform:scale(1.06)}
.mfilter{position:absolute;top:calc(var(--top) + env(safe-area-inset-top) + 22px);inset-inline-start:12px;inset-inline-end:68px;z-index:4;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;transition:opacity .6s,transform .8s var(--ease)}
.mfilter::-webkit-scrollbar{display:none}
.mfilter button{flex:none;display:inline-flex;align-items:center;gap:6px;height:38px;padding-inline:12px;border-radius:var(--pill);border:1px solid rgba(231,224,221,.24);background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--muted);font-size:13px;cursor:pointer;transition:border-color .3s,color .3s,background-color .3s}
.mfilter button .ic{width:15px;height:15px;color:var(--k,var(--gold-soft))}
.mfilter button[aria-pressed=true]{border-color:var(--k,var(--gold-soft));color:var(--paper);background:rgba(10,9,8,.86)}
.mfilter button em{font-style:normal}
/* a quiet top row on every screen: only the chosen filter shows its name; the rest are small icons (name on hover) */
.mfilter button{height:36px;padding-inline:12px;font-size:13px}
.mfilter button span{display:none}
.mfilter button:not([aria-pressed=true]){width:36px;padding:0;justify-content:center}
.mfilter button:not([aria-pressed=true]) em{display:none}
.mfilter button span{font-variant-numeric:tabular-nums;opacity:.6;font-size:12px}

/* the foot of the map: a slim day timeline, and one small card above it */
.dock{position:absolute;inset-inline:10px;bottom:calc(var(--bar) + env(safe-area-inset-bottom) + 10px);z-index:5;display:grid;justify-items:center;gap:8px;pointer-events:none;transition:opacity .6s,transform .8s var(--ease)}
.dock>*{pointer-events:auto}
.timeline{max-width:100%;display:flex;align-items:center;gap:2px;padding:5px;border-radius:var(--pill);background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--rule);overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth}
.timeline::-webkit-scrollbar{display:none}
.tl-play{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--gold);background:rgba(244,175,86,.08);color:var(--gold);display:grid;place-items:center;cursor:pointer;margin-inline-end:4px;transition:background-color .3s,transform .3s var(--spring)}
.tl-play:hover{background:rgba(244,175,86,.18)}
/* previous / next sit at the two ends of the timeline; the days scroll between them */
.timeline{overflow:hidden}
.tl-days{display:flex;align-items:center;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth}
.tl-days::-webkit-scrollbar{display:none}
.tl-days{-webkit-mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent);mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent);padding-inline:6px}
.tl-nav{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--gold);background:rgba(244,175,86,.08);color:var(--gold);display:grid;place-items:center;cursor:pointer;padding:0;transition:background-color .3s,opacity .3s}
.tl-nav:hover:not(:disabled){background:rgba(244,175,86,.18)}
.tl-nav:disabled{opacity:.3;cursor:default}
.tl-nav .ic{width:18px;height:18px}
[dir=rtl] .tl-nav .flip{transform:scaleX(-1)}
.tl-day{position:relative;flex:none;min-width:44px;height:42px;padding-inline:6px;border-radius:var(--pill);border:0;background:none;color:var(--muted);display:grid;align-content:center;justify-items:center;gap:2px;cursor:pointer;transition:background-color .3s,color .3s}
.tl-day b{font:700 14px/1 var(--label);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.tl-day small{font-size:10.5px;line-height:1;color:var(--faint);font-variant-numeric:tabular-nums}
.tl-day::after{content:"";position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--area,transparent)}
.tl-day:hover{background:rgba(254,251,241,.06)}
.tl-day[aria-selected=true]{background:var(--amber);color:var(--night)}
.tl-day[aria-selected=true] small{color:rgba(10,9,8,.7)}
.tl-day[aria-selected=true]::after{background:var(--night)}
.tl-day.done{color:var(--paper)}
.tl-day.today{box-shadow:inset 0 0 0 1.5px var(--leaf)}
.tl-day.today::before{content:"";position:absolute;top:-3px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--leaf);box-shadow:0 0 0 2px rgba(10,9,8,.8)}
.daycard{position:relative;width:min(440px,100%);max-height:min(46vh,420px);overflow-y:auto;overscroll-behavior:contain;padding:16px 18px 16px;border-radius:20px;background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--rule);box-shadow:0 18px 50px rgba(0,0,0,.4);display:grid;gap:8px;touch-action:pan-y}
/* see-through: the map stays visible behind the card and the timeline, softly blurred so the text still reads */
.daycard,.timeline{background:linear-gradient(180deg,rgba(10,9,8,.34),rgba(10,9,8,.5));-webkit-backdrop-filter:blur(7px) saturate(1.25);backdrop-filter:blur(7px) saturate(1.25);border-color:rgba(254,251,241,.18)}
.daycard{box-shadow:0 18px 50px rgba(0,0,0,.28)}
.daycard h3,.daycard p,.daycard .ft,.daycard .dd,.daycard .dl,.daycard .more,.tl-day{text-shadow:0 1px 3px rgba(0,0,0,.65)}
.daycard .pill{background:rgba(10,9,8,.32)}
.daycard .ctl button{background:rgba(10,9,8,.3)}
.daycard.in{animation:cardIn .55s var(--ease)}
.daycard.swap>.c{animation:rise .45s var(--ease)}
@keyframes cardIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.daycard .c{display:grid;gap:8px}
.daycard .hd{display:flex;align-items:center;gap:10px;padding-inline-end:44px;min-height:24px}
.daycard.intro .lbl{padding-inline-end:40px}
.daycard .dl{font:700 11px/1 var(--label);letter-spacing:.2em;text-transform:uppercase;color:var(--amber)}
[dir=rtl] .daycard .dl{font:700 14px/1 var(--sans);letter-spacing:0}
.daycard .dd{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.daycard h3{margin:0;font-size:19px;line-height:1.25;font-weight:700;text-wrap:balance}
.daycard p{margin:0;font-size:14.5px;line-height:1.55;color:var(--muted)}
.daycard .ft{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:12.5px;color:var(--faint)}
.daycard .ft>span{display:inline-flex;align-items:center;gap:6px;min-width:0}
.daycard .ft .ic{width:15px;height:15px;color:var(--gold-soft)}
.daycard .sun{font-variant-numeric:tabular-nums}
.daycard .ctl{position:absolute;top:10px;inset-inline-end:10px;display:flex;gap:4px}
.daycard .ctl button{width:38px;height:38px;border-radius:50%;border:1px solid var(--rule);background:rgba(10,9,8,.4);color:var(--paper);display:grid;place-items:center;cursor:pointer;padding:0}
.daycard .ctl .ic{width:16px;height:16px}
[dir=rtl] .daycard .flip{transform:scaleX(-1)}
.daycard .more{justify-self:start;display:inline-flex;align-items:center;gap:6px;padding:0;border:0;background:none;color:var(--gold-soft);font-size:13px;font-weight:700;cursor:pointer;text-decoration:underline;text-decoration-color:rgba(228,170,124,.4);text-underline-offset:4px}
.daycard .more .ic{width:15px;height:15px}
.daycard.intro .tt{font-size:30px}
.daycard.intro .dates{margin:0;font-size:14.5px;color:var(--muted)}
.daycard.intro .count{display:flex;align-items:center;gap:8px;margin:0;font-size:14px;color:var(--paper);font-variant-numeric:tabular-nums}
.daycard.intro .count .ic{width:16px;height:16px;color:var(--amber)}
.daycard .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.daycard.intro .hd{padding-inline-end:40px}
.peek{display:none}

/* the pop-up: next to the pin on wide screens, a sheet from below on phones */
#pop{position:absolute;left:0;top:0;z-index:7;width:340px;max-height:min(74vh,640px);overflow-y:auto;overscroll-behavior:contain;border-radius:20px;background:rgba(10,9,8,.92);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--rule);box-shadow:0 22px 60px rgba(0,0,0,.55);transform-origin:var(--ox,50%) var(--oy,100%)}
#pop.in{animation:popIn .5s var(--spring)}
@keyframes popIn{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:none}}
#pop .ph{aspect-ratio:3/2;border-radius:20px 20px 0 0}
#pop .ph img{animation:kb 14s ease-out forwards}
@keyframes kb{from{transform:scale(1.08)}to{transform:scale(1)}}
#pop .body{padding:18px 20px 20px;display:grid;gap:10px}
#pop .k{display:flex;align-items:center;gap:10px;padding-inline-end:44px}
#pop .x{position:absolute;top:10px;inset-inline-end:10px;z-index:2;width:38px;height:38px;border-radius:50%;border:1px solid var(--rule);background:rgba(10,9,8,.7);color:var(--paper);display:grid;place-items:center;cursor:pointer}
#pop h3{margin:2px 0 0;font-size:22px;line-height:1.2;text-wrap:balance}
#pop p{margin:0;color:var(--muted);font-size:15px;line-height:1.6}
#pop ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
#pop li{position:relative;padding-inline-start:16px;color:var(--muted);font-size:14.5px;line-height:1.5}
#pop li::before{content:"";position:absolute;inset-inline-start:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--amber)}
#pop .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
#pop .nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px;padding-top:12px;border-top:1px solid var(--rule)}
#pop .nav span{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
#pop .nav .icbtn{width:40px;height:40px;background:none}
[dir=rtl] #pop .nav .flip{transform:scaleX(-1)}
#pop .tx{display:grid;gap:10px}
#pop .tx.swap{animation:rise .5s var(--ease)}

/* the opening: a journey from night to dawn */
#journey{position:absolute;inset:0;z-index:9;pointer-events:none}
.jt{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;padding-inline:20px;transition:opacity 1s,transform 1.2s var(--ease)}
.jt.out{opacity:0;transform:translateY(-24px) scale(.98)}
.jt>*{animation:rise 1.1s var(--ease) backwards;animation-delay:calc(var(--i,0) * 160ms)}
.jt .logo{width:84px;aspect-ratio:501/594;margin-bottom:8px}
.jt .tt{font-size:clamp(46px,10vw,96px)}
.jt .dates{margin:0;color:var(--muted);font-size:17px}
.jc{position:absolute;inset-inline:16px;top:calc(env(safe-area-inset-top) + 9vh);margin:0;text-align:center;font-size:clamp(22px,4.2vw,40px);line-height:1.2;font-weight:400;color:var(--paper);text-shadow:0 2px 24px rgba(10,9,8,.9);text-wrap:balance;opacity:0}
.jc b{font-weight:700;color:var(--gold-soft)}
.jc.show{animation:capIn 1s var(--ease) both}
.jc.hide{animation:capOut .6s ease both}
@keyframes capIn{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes capOut{from{opacity:1}to{opacity:0;transform:translateY(-10px);filter:blur(4px)}}
#jskip{position:absolute;inset-inline-end:16px;bottom:calc(24px + env(safe-area-inset-bottom));pointer-events:auto;background:rgba(10,9,8,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.journeying .dock,.journeying .mapctl,.journeying .mfilter{opacity:0;pointer-events:none;transform:translateY(16px)}
.journeying .dock *{pointer-events:none}
.journeying .top{transform:translateY(-100%)}
.journeying .tabs{transform:translateY(100%)}

/* ---------- stories ---------- */
#stories{background:radial-gradient(90% 40% at 85% 0,rgba(218,125,43,.13),transparent 70%),linear-gradient(180deg,var(--night) 0,var(--earth-deep) 55%,var(--bark-deep) 100%)}
[dir=ltr] #stories{background:radial-gradient(90% 40% at 15% 0,rgba(218,125,43,.13),transparent 70%),linear-gradient(180deg,var(--night) 0,var(--earth-deep) 55%,var(--bark-deep) 100%)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:36px;padding-inline:16px;border-radius:var(--pill);border:1px solid rgba(231,224,221,.3);background:none;color:var(--muted);font-size:14px;cursor:pointer;transition:border-color .3s,color .3s,background-color .3s}
.chips button[aria-pressed=true]{border-color:var(--gold-soft);color:var(--paper);background:rgba(228,170,124,.1)}
.place{display:grid;gap:28px}
.place>header{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 16px;padding-bottom:12px;border-bottom:1px solid var(--rule)}
.place h3{margin:0;font-size:clamp(24px,4vw,32px);font-weight:700}
.place header span{color:var(--faint);font-size:14px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:40px 44px}
.story{display:grid;align-content:start;gap:10px;min-width:0;padding-inline-start:20px;border-inline-start:2px solid rgba(254,251,241,.3);transition:border-color .4s}
.story:hover{border-inline-start-color:var(--k)}
.story .ph{aspect-ratio:3/2;margin-bottom:6px}
.story .k{display:flex;align-items:center;gap:12px}
.story h4{margin:4px 0 0;font-size:21px;line-height:1.25;font-weight:700;text-wrap:balance}
.story p{margin:0;color:var(--muted);font-size:15.5px;max-width:62ch}
.story .btn{justify-self:start;margin-top:4px}

/* ---------- field: what to look for ---------- */
#field{background:radial-gradient(80% 40% at 50% 0,rgba(124,154,94,.16),transparent 70%),linear-gradient(180deg,var(--night) 0,var(--forest-night) 45%,#0B231E 100%)}
.fsec{display:grid;gap:20px}
.fhead{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}
.fhead h3{margin:0;font-size:clamp(22px,3.6vw,30px);font-weight:700}
.prog{flex:1 1 220px;display:flex;align-items:center;gap:12px;min-width:0}
.bar{flex:1;height:4px;border-radius:4px;background:rgba(254,251,241,.12);overflow:hidden}
.bar i{display:block;height:100%;width:var(--p,0%);background:linear-gradient(90deg,var(--forest),var(--amber));transition:width .7s var(--ease)}
[dir=rtl] .bar i{background:linear-gradient(270deg,var(--forest),var(--amber))}
.prog span{font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:14px}
.ftile{position:relative;display:grid;align-content:start;gap:8px;padding:18px;border-radius:18px;background:rgba(254,251,241,.035);border:1px solid var(--rule);transition:border-color .4s,background-color .4s;min-width:0;overflow:hidden}
.ftile.done{border-color:rgba(169,196,140,.55);background:rgba(124,154,94,.12)}
.ftile .top2{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ftile .no{font:700 12px/1 var(--label);letter-spacing:.18em;color:var(--amber);font-variant-numeric:tabular-nums}
.ftile .where{font-size:12.5px;color:var(--gold-soft)}
.ftile h4{margin:0;font-size:19px;line-height:1.25}
.ftile p{margin:0;font-size:14.5px;color:var(--muted)}
.ftile .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.ftile .ph{aspect-ratio:16/10;margin:-18px -18px 6px;border-radius:0}
.fnote{margin:0;font-size:14px;color:var(--faint)}

/* ---------- essentials ---------- */
#info{background:linear-gradient(180deg,var(--night) 0,var(--petrol-deep) 30%,#03313D 100%)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:20px 18px}
.fact{display:flex;align-items:center;gap:14px;min-width:0}
.fact b{display:block;font-size:13px;font-weight:700;color:var(--muted)}
.fact span{display:block;font-size:17px;color:var(--paper)}
.feet{display:flex;gap:2px}
.feet .ic{width:18px;height:18px}
.feet .ic.off{opacity:.3}
.block{display:grid;gap:22px}
.bh{display:flex;align-items:center;gap:14px}
.bh h3{margin:0;font-size:24px;font-weight:700}
.bh .n{margin-inline-start:auto;font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}
.flights{display:grid;border-top:1px solid var(--rule)}
.fl{display:grid;grid-template-columns:64px 76px minmax(0,1fr) auto;align-items:center;gap:12px;padding-block:14px;border-bottom:1px solid var(--rule);font-variant-numeric:tabular-nums}
.fl .d{color:var(--faint);font-size:14px}
.fl .t{font-size:17px;font-weight:700;color:var(--paper)}
.fl .r{display:flex;align-items:center;gap:10px;font:700 15px/1 var(--label);letter-spacing:.14em;color:var(--paper);direction:ltr;justify-content:flex-start}
[dir=rtl] .fl .r{justify-content:flex-end}
.fl .r .ic{width:16px;height:16px;color:var(--amber)}
.fl .r small{font:500 12px/1 var(--sans);letter-spacing:0;color:var(--faint)}
.fl .no{font-size:13px;color:var(--gold-soft);text-align:end}
.fl.pending{opacity:.6}
.fl.pending .no{color:var(--faint)}
.note{margin:0;padding-inline-start:16px;border-inline-start:2px solid var(--amber);color:var(--muted);font-size:15px;max-width:64ch}
.stays{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:26px 32px}
.stay{display:grid;gap:4px;align-content:start;padding-inline-start:16px;border-inline-start:2px solid rgba(254,251,241,.3);min-width:0}
.stay .nt{font-size:13px;color:var(--gold-soft);font-variant-numeric:tabular-nums}
.stay b{font-size:18px;color:var(--paper)}
.stay span{font-size:14px;color:var(--faint)}
.stay p{margin:4px 0 0;font-size:14.5px;color:var(--muted)}
.wx{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:28px;align-items:center}
.wx svg{width:100%;height:auto;display:block}
.wx p{margin:0;color:var(--muted);font-size:15.5px;max-width:60ch}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:48px 52px}
.ess{display:grid;align-content:start;gap:14px;min-width:0}
.ess .intro{margin:0;color:var(--muted);font-size:15px}
.ess ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.ess li{position:relative;padding-inline-start:18px;color:var(--muted);font-size:15px}
.ess li::before{content:"";position:absolute;inset-inline-start:0;top:.7em;width:6px;height:6px;border-radius:50%;background:var(--forest)}
.ess .rows{display:grid}
.ess .row{display:grid;grid-template-columns:minmax(84px,auto) minmax(0,1fr);gap:14px;padding-block:9px;border-bottom:1px solid var(--rule);font-size:15px}
.ess .row b{color:var(--paper);font-weight:700}
.ess .row span{color:var(--muted)}
.chk{display:grid;gap:4px}
.chk label{display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;align-items:start;padding-block:6px;font-size:15px;color:var(--muted);cursor:pointer}
.chk input{appearance:none;-webkit-appearance:none;width:22px;height:22px;margin:1px 0 0;border-radius:6px;border:1.5px solid rgba(254,251,241,.5);background:none;display:grid;place-items:center;cursor:pointer;transition:background-color .25s,border-color .25s}
.chk input:checked{background:var(--forest);border-color:var(--forest);animation:tick .35s var(--spring)}
.chk input:checked::after{content:"";width:10px;height:6px;border:2px solid var(--night);border-top:0;border-right:0;transform:translateY(-2px) rotate(-45deg)}
.chk input:checked+span{color:var(--paper);text-decoration:line-through;text-decoration-color:rgba(254,251,241,.35)}
.ess .small{margin:0;font-size:13.5px;color:var(--faint)}
.ess a.go{justify-self:start;display:inline-flex;align-items:center;min-height:40px;color:var(--gold-soft);font-weight:700;font-size:14px;text-underline-offset:4px}
.yesno{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:18px}
.yesno h4{margin:0 0 8px;font-size:14px;font-weight:700}
.yesno .y h4{color:var(--leaf)}.yesno .n h4{color:var(--amber)}
.yesno .n li::before{background:var(--amber)}
.mapnote{margin:0;font-size:12.5px;color:var(--faint);max-width:70ch}

/* ---------- leader: dawn ---------- */
#leader{background:linear-gradient(180deg,#203644 0,var(--fog) 22%,var(--fog-light) 62%,var(--cream) 100%);color:var(--navy)}
#leader.scroll::before{opacity:.06;filter:invert(1)}
#leader .lbl{color:var(--earth)}
.lead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center;padding:24px;border-radius:24px;background:rgba(255,255,255,.4);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.65);max-width:780px}
.face{width:132px;height:132px;border-radius:50%;padding:5px;border:2px solid var(--navy);display:grid;place-items:center}
.face>*{width:100%;height:100%;border-radius:50%;object-fit:cover}
.face .mono{display:grid;place-items:center;background:var(--navy)}
.face .mono .mark{width:52%;aspect-ratio:501/535}
.lead .tt{font-size:clamp(36px,7vw,58px)}
.lead .role{margin:8px 0 0;font-size:16px;color:#3B5168}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:18px;max-width:780px}
.roles div{padding-inline-start:16px;border-inline-start:2px solid var(--earth)}
.roles b{display:block;font-size:20px;color:var(--bark)}
.roles span{font-size:14.5px;color:#3B5168}
.bioband{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,360px);gap:40px;align-items:start;max-width:1000px}
.bioband .ph{aspect-ratio:4/5;border-radius:18px;box-shadow:0 24px 60px rgba(30,51,78,.28)}
/* with a story: one text column (bio, then the story) beside one photo that stays in view */
.bioband.has-story{grid-template-areas:"bio ph" "story ph";row-gap:0}
.bioband.has-story .bio{grid-area:bio}
.bioband.has-story .ph{grid-area:ph;position:sticky;top:-24px}
.bioband.has-story .lstory{grid-area:story;margin-top:36px;padding-top:32px;border-top:1px solid rgba(30,51,78,.16);max-width:62ch}
.bio{display:grid;gap:14px;max-width:62ch}
.bio p{margin:0;font-size:17px;line-height:1.7;color:#22384F}
.lstory{display:grid;gap:14px}
.lstory .lbl{margin:0}
.lstory h3{margin:0;font-size:clamp(24px,4vw,30px);line-height:1.2;color:var(--bark)}
.lstory .by{margin:0;font-size:14px;color:#3B5168}
.lstory p.t{margin:0;font-size:17px;line-height:1.75;color:#22384F}
.contact{display:grid;gap:16px;max-width:780px}
.contact .acts{display:flex;flex-wrap:wrap;gap:10px}
#leader .btn{color:#41352D;border-color:rgba(159,131,94,.55)}
#leader .btn.wa{color:var(--night);border-color:var(--wa)}
.cline{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:12px;border-bottom:1px solid rgba(30,51,78,.15);font-size:16px}
.cline b{min-width:64px;color:#3B5168;font-weight:500;font-size:14px}
.cline span{direction:ltr;font-variant-numeric:tabular-nums;color:var(--navy);font-weight:700;user-select:all;-webkit-user-select:all}
.cline .btn{margin-inline-start:auto}
.closing{display:grid;justify-items:start;gap:18px;max-width:640px}
.closing p{margin:0;font-size:clamp(20px,3.4vw,26px);line-height:1.45;color:var(--bark);text-wrap:balance}
.closing .logo{width:72px;aspect-ratio:501/594;background:var(--stone)}

/* ---------- shared pieces: pills, faces, a photo at the head of each room, tiles without a photo ---------- */
.pill{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:4px 14px;border-radius:var(--pill);border:1px solid var(--rule);background:rgba(254,251,241,.05);color:var(--paper);font:500 13px/1.2 var(--sans);cursor:pointer;text-align:start;transition:border-color .3s,background-color .3s,transform .35s var(--spring)}
.pill:hover{border-color:rgba(254,251,241,.42);background:rgba(254,251,241,.08)}
.pill:active{transform:scale(.96)}
.pill>.ic{width:16px;height:16px;color:var(--gold-soft)}
.pill b{font-weight:700}
.pill small{color:var(--faint);font-size:12px}
.pill.hasfaces{padding-inline-start:5px}
.faces{display:flex;flex:none}
.faces>span{width:28px;height:28px;border-radius:50%;border:2px solid #1A1714;margin-inline-start:-9px;background:#26221D center/cover no-repeat;display:grid;place-items:center;flex:none}
.faces>span:first-child{margin-inline-start:0}
.faces .ic{width:14px;height:14px;color:var(--leaf)}
.faces .more{font:700 10px/1 var(--label);color:var(--paper);background:#2E2924}
.daycard .xtra{display:flex;flex-wrap:wrap;gap:8px}
.sunin{display:inline-flex;align-items:center;gap:6px;color:var(--amber);font-weight:700}
.hero{position:relative;margin:calc(-1 * (var(--top) + env(safe-area-inset-top) + 36px)) -16px 0;min-height:clamp(320px,50vh,540px);display:grid;align-items:end;overflow:hidden;isolation:isolate}
.hero>figure{position:absolute;inset:0;margin:0;z-index:-1;background:#14120F}
.hero.tall{min-height:clamp(440px,72vh,700px)}   /* a photo of people: room for their faces above the title */
@media (max-width:759px){.hero.tall{padding-top:calc(var(--top) + env(safe-area-inset-top) + 70vw)}}   /* phones: the subject above, the words below */
.hero>figure img{display:block;width:100%;height:100%;object-fit:cover;animation:kb 20s ease-out forwards}
.hero>figure picture{display:contents}
.hero>figure img{object-position:var(--op,50% 50%)}
@media (max-width:759px){.hero>figure img{object-position:var(--opm,var(--op,50% 50%))}}
.hero>figure::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,9,8,.6) 0,rgba(10,9,8,.08) 26%,rgba(10,9,8,.3) 58%,var(--night) 100%)}
/* keep the title clear of the top bar and the floating back button */
.hero{padding-top:calc(var(--top) + env(safe-area-inset-top) + 76px)}
.hero .in{width:100%;max-width:1080px;margin-inline:auto;padding:0 16px 4px;display:grid;gap:12px}
.hero .tt{font-size:clamp(42px,10vw,84px)}
.hero .lede{color:rgba(254,251,241,.86)}
.room.enter .hero .in>*{animation:rise .9s var(--ease) backwards;animation-delay:calc(var(--i,0) * 90ms)}
.hero+.wrap{margin-top:36px}
.noph{position:relative;margin:-18px -18px 6px;aspect-ratio:16/7;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(90% 130% at 50% 0,color-mix(in srgb,var(--k,var(--gold-soft)) 30%,transparent),transparent 72%),rgba(254,251,241,.025)}
.noph::before{content:"";position:absolute;inset:0;background:url(img/contour.webp) center/cover no-repeat;opacity:.18}
.noph .ring{position:relative;width:58px;height:58px;color:var(--k,var(--paper));border-color:color-mix(in srgb,var(--k,var(--paper)) 70%,transparent);background:rgba(10,9,8,.4)}
.noph .ring .ic{width:26px;height:26px}
.ftile{transition:border-color .4s,background-color .4s,transform .45s var(--ease),box-shadow .45s}
@media (hover:hover){.ftile:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(0,0,0,.28)}}
.ftile.flash{animation:flash 1.6s var(--ease)}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(232,162,62,0)}25%{box-shadow:0 0 0 3px rgba(232,162,62,.9)}}
.ftile .ph img{transition:transform .8s var(--ease)}
@media (hover:hover){.ftile:hover .ph img{transform:scale(1.04)}}
.k-animal{--k:var(--leaf)} .k-exercise{--k:var(--amber)}

/* ---------- stories as tiles: the first lines, then the rest on tap ---------- */
.scard h4,.scard .txt,.scard .ph,.scard .noph{cursor:pointer}
.scard .txt{display:grid;gap:10px}
.scard .txt p{margin:0}
.scard:not(.open) .txt p:not(:first-child){display:none}
.scard:not(.open) .txt p:first-child{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.scard .k{display:flex;align-items:center;gap:10px}
.scard .k .ring{width:34px;height:34px}
.scard .k .ring .ic{width:16px;height:16px}
.scard .rd{margin-inline-start:auto;display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--leaf)}
.scard .rd .ic{width:14px;height:14px}
.sgrid{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.rprog{display:flex;align-items:center;gap:12px;max-width:420px}

/* ---------- small celebrations ---------- */
.spark{position:fixed;z-index:80;left:0;top:0;width:16px;height:16px;margin:-8px 0 0 -8px;pointer-events:none;color:var(--c,var(--gold));animation:spark .95s var(--ease) forwards}
.spark .ic{width:16px;height:16px;fill:currentColor;stroke-width:1}
@keyframes spark{0%{transform:translate(0,0) scale(.3) rotate(0);opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(var(--r));opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(var(--bar) + env(safe-area-inset-bottom) + 18px);z-index:70;width:max-content;max-width:calc(100vw - 32px);transform:translate(-50%,24px);opacity:0;display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:var(--pill);background:rgba(10,9,8,.94);border:1px solid rgba(232,162,62,.6);color:var(--paper);font-size:14px;font-weight:700;box-shadow:0 16px 40px rgba(0,0,0,.5);pointer-events:none;transition:opacity .35s,transform .5s var(--spring)}
.toast .ic{width:18px;height:18px;color:var(--amber)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- the opening's progress ---------- */
.jbar{position:absolute;top:env(safe-area-inset-top);inset-inline:0;height:3px;background:rgba(254,251,241,.1)}
.jbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-soft),var(--amber));transform-origin:0 50%;transform:scaleX(0)}
[dir=rtl] .jbar i{transform-origin:100% 50%}
.jbar.go i{transform:scaleX(1);transition:transform var(--jd,18s) linear}

/* ---------- essentials: quick actions, two clocks, day by day, cards ---------- */
.qa{display:flex;flex-wrap:wrap;gap:8px}
.qa .pill{min-height:44px;font-size:14px}
.clocks{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:560px}
.clock{display:grid;gap:2px;padding:16px 18px;border-radius:18px;background:rgba(254,251,241,.04);border:1px solid var(--rule)}
.clock span{font-size:13px;color:var(--faint)}
.clock b{font:600 30px/1.1 var(--label);color:var(--paper);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clock small{font-size:12.5px;color:var(--gold-soft)}
.dlist{display:grid;gap:8px}
.drow{display:grid;grid-template-columns:56px minmax(0,1fr) 20px;gap:14px;align-items:center;width:100%;padding:12px 14px;border-radius:16px;background:rgba(254,251,241,.04);border:1px solid var(--rule);color:inherit;font:inherit;text-align:start;cursor:pointer;transition:border-color .3s,background-color .3s,transform .35s var(--spring)}
.drow:hover{border-color:rgba(232,162,62,.5);background:rgba(254,251,241,.07)}
.drow:active{transform:scale(.985)}
.drow .n{position:relative;display:grid;justify-items:center;gap:3px}
.drow .n b{font:700 19px/1 var(--label);color:var(--amber);font-variant-numeric:tabular-nums}
.drow .n small{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.drow .n::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--area,transparent)}
.drow .h{display:block;font-size:16.5px;font-weight:700;line-height:1.3;color:var(--paper)}
.drow .p{display:-webkit-box;margin-top:3px;font-size:13.5px;line-height:1.5;color:var(--muted);-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.drow .ic{width:16px;height:16px;color:var(--faint)}
[dir=rtl] .drow .ic{transform:scaleX(-1)}
.dday.today .drow{border-color:rgba(169,196,140,.7)}
.dday{display:grid}
.drow .ic{transition:transform .35s var(--ease)}
.dday.open .drow{border-color:rgba(232,162,62,.5);border-end-start-radius:0;border-end-end-radius:0;background:rgba(254,251,241,.07)}
.dday.open .drow .ic{transform:rotate(90deg)}
.dday.open .drow .p{display:none}
.dpanel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}
.dday.open .dpanel{grid-template-rows:1fr}
.dpin{overflow:hidden;min-height:0}
.dday.open .dpin{padding:4px 16px 16px;border:1px solid rgba(232,162,62,.5);border-top:0;border-radius:0 0 16px 16px;background:rgba(254,251,241,.035)}
.dpin{display:grid;gap:12px}
.dpin .full{margin:8px 0 0;font-size:15px;line-height:1.6;color:var(--muted)}
.dpin .rows{display:grid}
.sched{list-style:none;margin:10px 0 2px;padding:0;display:grid;position:relative}
.sched::before{content:"";position:absolute;inset-block:18px 30px;inset-inline-start:27px;width:1px;background:rgba(232,162,62,.35)}
.sched li{position:relative;display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;align-items:baseline;padding-block:8px;font-size:15px;line-height:1.5;color:var(--paper)}
.sched .tm{position:relative;z-index:1;justify-self:center;padding:3px 7px;border-radius:8px;background:#13241f;border:1px solid rgba(232,162,62,.55);font:700 13px/1 var(--label);color:var(--amber);font-variant-numeric:tabular-nums;direction:ltr}
.sched .tm i{display:block;width:6px;height:6px;border-radius:50%;background:var(--gold-soft)}
.sched .tm:has(i){width:14px;height:14px;padding:0;display:grid;place-items:center;border-radius:50%;align-self:start;margin-top:5px}
.dpin .row{display:grid;grid-template-columns:118px minmax(0,1fr);gap:14px;padding-block:9px;border-bottom:1px solid var(--rule);font-size:14.5px}
.dpin .row:last-child{border-bottom:0}
.dpin .row b{color:var(--gold-soft);font-weight:600}
.dpin .row span{color:var(--paper)}
.dpin .btn{justify-self:start}
.ess{padding:20px;border-radius:20px;background:rgba(254,251,241,.035);border:1px solid var(--rule)}
.egrid{gap:14px}
.phr{display:grid}
.phr .w{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding-block:10px;border-bottom:1px solid var(--rule)}
.phr .w b{font-size:16px;color:var(--paper)}
.phr .w span{font-size:14px;color:var(--muted)}
.phr .w .as{grid-row:span 2;align-self:center;font-size:20px;color:var(--gold-soft)}
.phr .w small{font-size:13px;color:var(--faint);direction:ltr;text-align:start}
[dir=rtl] .phr .w small{text-align:end}

/* ---------- wide screens ---------- */
@media (min-width:760px){.mfilter{inset-inline-end:76px}}
@media (min-width:960px){

  .bioband.has-story{grid-template-areas:"bio" "ph" "story";row-gap:28px}
  .bioband.has-story .ph{position:static}
  .bioband.has-story .lstory{margin-top:8px}.bioband .ph{max-width:420px}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.jc{opacity:1}}

// NOAA solar equations, local time for a given date and place
function sunTimes(s, [lon, lat], tz) {
  const { y, m, d } = parseDay(s);

  const f = mins => { const t = ((mins + tz * 60) % 1440 + 1440) % 1440; return `${pad2(Math.floor(t / 60))}:${pad2(Math.floor(t % 60))}`; };

}

  if (now < dep) { const h = (dep - now) / 3600e3; return h >= 24 ? { k: 'days', n: Math.ceil(h / 24) } : { k: 'hours', n: Math.max(1, Math.ceil(h)) }; }

    const local = new Date(now + T.tz * 3600e3).toISOString().slice(0, 10);
    const day = T.days.find(d => d.date === local) || T.days[0];

  }

}
const localToday = () => new Date(Date.now() + T.tz * 3600e3).toISOString().slice(0, 10);
const todayDate = () => tripState().k === 'during' ? localToday() : null;
// on the day itself, how long until the next sunrise or sunset at the lodge
function sunCountdown(sun) {
  const now = ((Date.now() / 6e4 + T.tz * 60) % 1440 + 1440) % 1440;
  const mins = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
  const r = mins(sun.rise), st = mins(sun.set);
  const [k, dt] = now < r ? ['rise', r - now] : now < st ? ['set', st - now] : [null, 0];

}

// swipe the card to move between days
(() => {
  let sx = 0, sy = 0, on = false;
  card.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; on = true; });
  card.addEventListener('pointerup', e => {
    if (!on) return; on = false;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.5 || current < 0) return;
    const fwd = lang === 'he' ? dx > 0 : dx < 0;
    const n = clamp(current + (fwd ? 1 : -1), 0, 9);

  });
})();

let playRun = 0;
function setPlaying(on) {
  playing = on;
  $$('[data-play]').forEach(x => {
    if (x.classList.contains('tl-play')) { x.innerHTML = ic(on ? 'pause' : 'play'); x.setAttribute('aria-label', on ? L.pause : L.play); x.title = on ? L.pause : L.play; }
    else x.innerHTML = `${ic(on ? 'pause' : 'play')}<span>${on ? L.pause : L.play}</span>`;
  });
}
const lastDay = () => Math.max(...T.days.map(d => d.n));
async function togglePlay() {
  if (playing) { setPlaying(false); return; }
  if (journeyOn) { seq++; endJourney(false); }
  closePop();
  setPlaying(true);
  let n = current >= 0 && current < lastDay() ? current : 0;
  const run = ++playRun;
  while (playing && run === playRun && n <= lastDay()) {
    await goDay(n);
    if (!playing || run !== playRun) return;
    await wait(1500);
    n++;
  }
  if (run === playRun && playing) setPlaying(false);
}

// becomes a little timetable: 07:00 Take-off… / 14:30 We continue… / 19:20 Landing / · Pick-up…
const TIME = /\b([01]?\d|2[0-3])[:.]([0-5]\d)\b/;
function schedSteps(text) {
  const out = [], cap1 = t => t.charAt(0).toLocaleUpperCase() + t.slice(1);
  const clean = (t, tm) => cap1(t.replace(new RegExp(`^(?:and\\s+|ו)?(?:at|from|around|by|ב[-־]?|בשעה|סביב|עד)?\\s*${tm.replace('.', '[:.]')}\\s*[,:–-]?\\s*`, 'i'), '')
    .replace(new RegExp(`\\s*,?\\s*(?:at|around|ב[-־]?|בשעה)\\s*${tm.replace('.', '[:.]')}`, 'i'), '').replace(/\s+([,.])/g, '$1').trim());
  for (const sen of String(text || '').split(/(?<=[.!?])\s+/).filter(Boolean)) {
    const parts = sen.split(/,\s+/), clauses = parts.length > 1 && parts.slice(1).some(p => TIME.test(p)) ? parts : [sen];
    for (const cl of clauses) {
      const m = cl.match(TIME), tm = m ? `${m[1].padStart(2, '0')}:${m[2]}` : '';
      out.push({ t: tm, x: m ? clean(cl, m[0]) : cap1(cl.trim()) });
    }
  }
  return out.filter(s => s.x);
}
function schedHTML(text) {
  const st = schedSteps(text);
  if (!st.some(s => s.t)) return `<p class="full">${esc(text)}</p>`;
  return `<ol class="sched">${st.map(s => `<li><span class="tm">${s.t ? esc(s.t) : '<i></i>'}</span><span>${esc(s.x.replace(/[.]$/, ''))}</span></li>`).join('')}</ol>`;

// Israel's clock follows its own summer time; the tour's clock is a fixed offset from UTC
function renderClocks() {
  const il = $('#clk-il'), as = $('#clk-as'); if (!il || !as) return;

  let ilT = null;
  try { ilT = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Jerusalem', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date()); } catch (e) {}
  if (!ilT) { il.parentElement.hidden = true; return; }
  il.textContent = ilT;
  const [h, m] = ilT.split(':').map(Number);
  let diff = (Math.floor(asM) - (h * 60 + m) + 1440) % 1440; if (diff > 720) diff -= 1440;

// the flights and the expedition dates as a calendar file
const icsEsc = t => String(t).replace(/\\/g, '\\\\').replace(/([,;])/g, '\\$1').replace(/\n/g, '\\n');
function downloadICS() {

  const z = iso => new Date(iso).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const stamp = z(new Date().toISOString()), ymd = s => s.replace(/-/g, '');

    `SUMMARY:${icsEsc(`MW Photo Tours · ${title}`)}`, 'END:VEVENT'];
  T.flights.rows.filter(r => r.dep).forEach((r, i) => {
    lines.push('BEGIN:VEVENT', `UID:${T.slug}-flight-${i}@mw.photography`, `DTSTAMP:${stamp}`, `DTSTART:${z(r.dep)}`);
    if (r.arr) lines.push(`DTEND:${z(r.arr)}`);
    lines.push(`SUMMARY:${icsEsc(`${tx(r.flight)} · ${r.from} → ${r.to}`)}`, `DESCRIPTION:${icsEsc(`${L.i.calTitle}: ${title}`)}`);
    if (i === 0) lines.push('BEGIN:VALARM', 'TRIGGER:-P1D', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(L.i.calDep)}`, 'END:VALARM');
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([lines.join('\r\n') + '\r\n'], { type: 'text/calendar;charset=utf-8' }));
    a.download = `${T.slug}.ics`; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    toast(L.toast.cal, 'calendar');
  } catch (e) {}
}
$('#info').addEventListener('click', e => {
  if (e.target.closest('[data-ics]')) { downloadICS(); return; }
  const j = e.target.closest('[data-jump]'); if (j) { goto('info:' + j.dataset.jump); return; }
  const d = e.target.closest('[data-dayrow]'); if (d) { const w = d.closest('.dday'), on = !w.classList.contains('open'); w.classList.toggle('open', on); d.setAttribute('aria-expanded', on); return; }
  const dm = e.target.closest('[data-daymap]'); if (dm) { backDay = -1; backRoom = { tab: 'info', day: +dm.dataset.daymap }; setTab('route'); setPlaying(false); goDay(+dm.dataset.daymap); return; }
});
function weatherSVG(wx) {
  const I = L.i, rtl = lang === 'he';
  const a = rtl ? [250, 96] : [30, 96], b = rtl ? [30, 96] : [250, 96];
  return `<svg viewBox="0 0 280 140" role="img" aria-label="${esc(`${I.morning} ${wx.morning[0]}–${wx.morning[1]}°, ${I.day} ${wx.day[0]}–${wx.day[1]}°`)}">
    <path d="M30 96 Q140 -8 250 96" fill="none" stroke="rgba(254,251,241,.35)" stroke-width="1.2" stroke-dasharray="2 5" stroke-linecap="round"/>
    <circle cx="${a[0]}" cy="${a[1]}" r="4" fill="#9CB1C2"/><circle cx="${b[0]}" cy="${b[1]}" r="6" fill="#E8A23E"/>
    <g transform="translate(128 28)" fill="none" stroke="#E8A23E" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><path d="M12 2.5v2.5m0 14v2.5M2.5 12H5m14 0h2.5M5.3 5.3 7 7m10 10 1.7 1.7m0-13.4L17 7M7 17l-1.7 1.7"/></g>
    <text x="${a[0]}" y="124" text-anchor="middle" fill="#F4F4F4" font-size="17" font-weight="700" font-family="Google Sans, Arial">${wx.morning[0]}–${wx.morning[1]}°</text>
    <text x="${a[0]}" y="80" text-anchor="middle" fill="rgba(244,244,244,.6)" font-size="12" font-family="Google Sans, Arial">${esc(I.morning)}</text>
    <text x="${b[0]}" y="124" text-anchor="middle" fill="#F4F4F4" font-size="17" font-weight="700" font-family="Google Sans, Arial">${wx.day[0]}–${wx.day[1]}°</text>
    <text x="${b[0]}" y="80" text-anchor="middle" fill="rgba(244,244,244,.6)" font-size="12" font-family="Google Sans, Arial">${esc(I.day)}</text>
  </svg>`;
}
$('#info').addEventListener('change', e => {
  const c = e.target.closest('[data-chk]'); if (!c) return;
  checks[c.dataset.chk] = c.checked; store.set(KEY + '-check', JSON.stringify(checks));
  const sec = T.essentials.find(s => s.check && s.check.some(it => it.id === c.dataset.chk));
  const done = sec.check.filter(it => checks[it.id]).length;
  const n = $(`[data-count="${sec.id}"]`);
  if (n) n.textContent = L.i.of(done, sec.check.length);
  const all = T.essentials.flatMap(s => s.check || []), ac = $('[data-allcount]');
  if (ac) ac.textContent = `${all.filter(it => checks[it.id]).length}/${all.length}`;
  if (c.checked) burst(c, 'var(--leaf)', 'tick');
  if (c.checked && done === sec.check.length) setTimeout(() => toast(L.toast.packed, 'check'), 300);
});

// ---------- leader ----------
function renderLeader() {
  const ld = T.leader, l = L.l, [first, ...rest] = ld.name[lang].split(' ');
  const face = ld.photo ? `<img src="${esc(ld.photo)}" alt="${esc(ld.name[lang])}">` : `<span class="mono"><span class="mark"></span></span>`;
  const wa = `https://wa.me/${ld.wa}?text=${encodeURIComponent(l.waText)}`;
  const band = ld.band ? `<figure class="ph"><img src="${esc(ld.band.src)}" alt="${esc(ld.band.alt[lang])}" loading="lazy" decoding="async"><figcaption>${esc(ld.band[lang])}</figcaption></figure>` : '';
  $('#leader').innerHTML = `<div class="wrap">
    <header class="rh" style="--i:0"><p class="lbl">${esc(l.kicker)}</p></header>
    <div class="lead" style="--i:1"><div class="face">${face}</div><div><h2 class="tt ink"><span>${esc(first)}</span> <b>${esc(rest.join(' '))}</b></h2><p class="role">${esc(ld.role[lang])}</p></div></div>
    <div class="roles" style="--i:2">${ld.roles.map(r => `<div><b>${esc(r[lang][0])}</b><span>${esc(r[lang][1])}</span></div>`).join('')}</div>
    <div class="bioband${ld.story && ld.story[lang] ? ' has-story' : ''}" style="--i:3"><div class="bio">${ld.bio[lang].map(p => `<p>${esc(p)}</p>`).join('')}</div>${band}
    ${ld.story && ld.story[lang] ? `<article class="lstory"><p class="lbl">${esc(ld.story[lang].kicker || '')}</p>${ld.story[lang].title ? `<h3>${esc(ld.story[lang].title)}</h3>` : ''}${ld.story[lang].by ? `<p class="by">${esc(ld.story[lang].by)}</p>` : ''}${ld.story[lang].text.map(t => `<p class="t">${esc(t)}</p>`).join('')}</article>` : ''}</div>
    <section class="contact" style="--i:4"><h3 style="margin:0;font-size:24px;color:var(--bark)">${esc(l.contact)}</h3>
      <div class="acts"><a class="btn wa" href="${wa}" target="_blank" rel="noopener">${ic('wa')}<span>${esc(l.wa)}</span></a>
        <a class="btn" href="${esc(ld.instagram)}" target="_blank" rel="noopener">${ic('ig')}<span>${esc(l.ig)}</span></a></div>
      <div>
        <div class="cline"><b>${esc(l.phone)}</b><span>${esc(ld.phone)}</span><button class="btn small" type="button" data-copy="${esc(ld.phone)}">${ic('copy')}<span>${esc(l.copy)}</span></button></div>
        <div class="cline"><b>${esc(l.mail)}</b><span>${esc(ld.email)}</span><button class="btn small" type="button" data-copy="${esc(ld.email)}">${ic('copy')}<span>${esc(l.copy)}</span></button></div>
      </div>
      <p style="margin:0;color:#3B5168">${esc(ld.group[lang])}</p>
    </section>
    <div class="closing" style="--i:5"><p>${esc(T.closing[lang])}</p><span class="logo" role="img" aria-label="MW Photo Tours"></span></div>
  </div>`;
}
$('#leader').addEventListener('click', e => {
  const b = e.target.closest('[data-copy]'); if (!b) return;
  const done = () => { b.lastElementChild.textContent = L.l.copied; setTimeout(() => { b.lastElementChild.textContent = L.l.copy; }, 1600); };
  const fallback = () => { const s = b.previousElementSibling, r = document.createRange(); r.selectNodeContents(s); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); };
  try { navigator.clipboard.writeText(b.dataset.copy).then(done, fallback); } catch (err) { fallback(); }
});

// ---------- rooms ----------
function setTab(name, opts = {}) {
  const changed = tab !== name, fromPop = !!(history.state && history.state.pop);
  if (name !== 'route' && fromPop) closePop({ hist: true });
  tab = name;
  $$('#tabs button').forEach(b => { const on = b.dataset.tab === name; b.setAttribute('aria-selected', on); b.tabIndex = on ? 0 : -1; });
  ROOMS.forEach(r => { $('#' + r).hidden = r !== name; });
  if (name !== 'route') { setPlaying(false); closePop(); if (journeyOn) { seq++; endJourney(false); } }
  if (changed && name !== 'route' && !reduce) { const el = $('#' + name); el.classList.remove('enter'); void el.offsetWidth; el.classList.add('enter'); el.scrollTop = 0; }
  if (name === 'route') backDay = -1;
  renderBack();
  if (opts.hist !== false && (changed || !fromPop)) hist(changed && !fromPop && opts.push !== false, { tab: name });
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) { if (b.dataset.tab !== tab) { backDay = -1; backRoom = null; } setTab(b.dataset.tab); } });
// a way home from every room: back to the map, and to the day you came from
let backDay = -1, backRoom = null;   // backRoom: the page you left for the map, e.g. the day-by-day schedule
function renderBack() {
  const b = $('#back'), off = tab === 'route' && !backRoom;
  b.hidden = off; document.body.classList.toggle('back-on-map', tab === 'route' && !off);
  b.lastElementChild.textContent = L.back; b.setAttribute('aria-label', L.back); b.title = L.back;
}
$('#back').addEventListener('click', () => {
  if (tab === 'route' && backRoom) {
    const r = backRoom; backRoom = null; setTab(r.tab);
    const row = r.day != null && $(`[data-dayrow="${r.day}"]`);
    if (row) { const w = row.closest('.dday'); w.classList.add('open'); row.setAttribute('aria-expanded', 'true');
      requestAnimationFrame(() => requestAnimationFrame(() => w.scrollIntoView({ block: 'center', behavior: reduce ? 'auto' : 'smooth' }))); }
    return;
  }
  const n = backDay;
  setTab('route');
  if (n >= 0 && T.days.some(d => d.n === n)) { if (n !== current) goDay(n, false); else { cardOpen = true; renderCard('in'); } }
});
$('#tabs').addEventListener('keydown', e => {
  const d = { ArrowRight: lang === 'he' ? -1 : 1, ArrowLeft: lang === 'he' ? 1 : -1 }[e.key];
  if (!d) return;
  const n = ROOMS[(ROOMS.indexOf(tab) + d + ROOMS.length) % ROOMS.length]; setTab(n); $('#t-' + n).focus();
});

function open(quiet) {
  const gate = $('#gate');
  $('#shell').hidden = false;
  if (reduce || quiet) gate.hidden = true;
  else { gate.classList.add('leave'); setTimeout(() => { gate.hidden = true; }, 900); }
  buildMap(); renderAll();
  const r = mapEl.getBoundingClientRect(); W = r.width || innerWidth; H = r.height || innerHeight;
  settleLegs(-1); setView(fit(T.views.all));
  const st = tripState();
  const hash = location.hash.slice(1);
  setTab(ROOMS.includes(hash) ? hash : 'route', { push: false });
  if (st.k === 'during') goDay(st.n, false);
  else if (tab === 'route' && !store.get(KEY + '-seen') && !reduce) setTimeout(journey, quiet ? 300 : 700);
  setInterval(() => { renderChip(); if (tab === 'info') renderClocks(); }, 30e3);
  // on the site, keep the page, map and photos on the phone for the parks, where signal is thin
  try { if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
}

// ---------- start ----------
applyLang();
(async () => {
  const hash = location.hash.slice(1);
  if (hash === 'en' || hash === 'he') { lang = hash; store.set('mw-tour-lang', lang); applyLang(); }
  const saved = store.get(KEY + '-code');
  const fromHash = hash && !ROOMS.includes(hash) && hash !== 'en' && hash !== 'he' ? hash : '';
  if (fromHash && await tryCode(fromHash, true)) return;
  if (saved && await tryCode(saved, true)) return;
  $('#code').focus({ preventScroll: true });
})();
})();
</script>
